name: Temporary Livre V Chapter 15 Vector Fixtures

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/tmp_l5_ch15_trigger.txt"

permissions:
  contents: read

concurrency:
  group: livre-v-ch15-vector-fixtures
  cancel-in-progress: false

jobs:
  validate-vector-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-v-ch15-bases-vectorielles-recherche-semantique

      - name: Execute deterministic synthetic vector fixtures
        run: |
          mkdir -p dist
          set -o pipefail
          python3 tools/tmp_l5_ch15_validate_vectors_run.py \
            | tee dist/QA-LIVRE-V-CH15-VECTORS.log

      - name: Upload vector fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livre-v-ch15-vector-fixtures
          if-no-files-found: warn
          retention-days: 30
          path: |
            dist/QA-LIVRE-V-CH15-VECTORS.json
            dist/QA-LIVRE-V-CH15-VECTORS.log
