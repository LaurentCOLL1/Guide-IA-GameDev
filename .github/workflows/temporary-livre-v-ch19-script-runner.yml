name: Temporary Livre V Chapter 19 Script Runner

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 351 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/livre-v-ch19-reference-audio'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/livre-v-ch19-reference-audio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Finalize governance and evidence
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python .qa/livre-v-ch19-finalize.py

      - name: Validate chapters without PDF
        run: python tools/validate_chapters.py --root . --report dist/QA-CHAPTERS.md

      - name: Validate Livre V cards and deep links
        run: python tools/validate_livre_v_references.py --check

      - name: Validate structured code explanations
        run: python tools/check_code_explanation_structure.py --check

      - name: Validate usage contexts
        run: python tools/check_context_markers.py --check

      - name: Validate semantic usage contexts
        run: python tools/audit_contextes_semantiques.py --check

      - name: Assert that no PDF was produced
        run: |
          if find . -type f -name '*.pdf' -print -quit | grep -q .; then
            echo "Un PDF a été produit pendant une validation légère." >&2
            exit 1
          fi

      - name: Remove temporary files and reports
        run: |
          rm -rf dist
          rm -f .qa/livre-v-ch19-main-trigger
          rm -f .qa/livre-v-ch19-finalize.py

      - name: Commit finalized permanent lot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "docs(livre-v): finaliser la fiche 19"
          git push origin HEAD:docs/livre-v-ch19-reference-audio
