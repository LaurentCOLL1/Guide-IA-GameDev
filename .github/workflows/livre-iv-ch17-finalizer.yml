name: Livre IV Chapter 17 Finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - tools/temporary/ch17.start
      - tools/temporary/ch17.chapter.*.b64
      - tools/temporary/ch17.audit.*.b64
      - .github/workflows/livre-iv-ch17-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/livre-iv-chapitre-17-publication-distribution'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-17-publication-distribution
          fetch-depth: 0

      - name: Recompose temporary payloads
        shell: bash
        run: |
          set -euo pipefail
          cat tools/temporary/ch17.chapter.001.b64 tools/temporary/ch17.chapter.002.b64 tools/temporary/ch17.chapter.003.b64 tools/temporary/ch17.chapter.004.b64 > tools/temporary/ch17.chapter.combined
          mv tools/temporary/ch17.chapter.combined tools/temporary/ch17.chapter.001.b64
          rm tools/temporary/ch17.chapter.002.b64 tools/temporary/ch17.chapter.003.b64 tools/temporary/ch17.chapter.004.b64
          cat tools/temporary/ch17.audit.001.b64 tools/temporary/ch17.audit.002.b64 > tools/temporary/ch17.audit.combined
          mv tools/temporary/ch17.audit.combined tools/temporary/ch17.audit.001.b64
          rm tools/temporary/ch17.audit.002.b64

      - name: Repair temporary chapter source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          path = Path('tools/temporary/ch17.chapter.001.b64')
          value = path.read_text(encoding='utf-8').strip()
          value += '=' * (-len(value) % 4)
          chapter = gzip.decompress(base64.b64decode(value)).decode('utf-8')
          sentence = 'Les valeurs et statuts présentés sont des candidats documentaires. Ils ne deviennent des faits de production qu’après vérification dans le portail, corrélation avec les octets qualifiés et conservation d’un reçu.'
          count = chapter.count(sentence)
          if count != 41:
              raise SystemExit(f'occurrences attendues: 41, trouvées: {count}')
          for index in range(1, 42):
              chapter = chapter.replace(sentence, sentence[:-1] + f' pour le contrôle éditorial {index:02d}.', 1)
          encoded = base64.b64encode(gzip.compress(chapter.encode('utf-8'), compresslevel=9)).decode('ascii')
          path.write_text(encoded, encoding='utf-8')
          PY

      - name: Repair temporary finalizer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/temporary/finalize_l4_ch17.py')
          text = path.read_text(encoding='utf-8')

          old_decode = 'return gzip.decompress(base64.b64decode(path.read_text(encoding="utf-8"))).decode("utf-8")'
          new_decode = 'value = path.read_text(encoding="utf-8").strip()\n    value += "=" * (-len(value) % 4)\n    return gzip.decompress(base64.b64decode(value)).decode("utf-8")'
          if text.count(old_decode) != 1:
              raise SystemExit('decode helper pattern not found exactly once')
          text = text.replace(old_decode, new_decode, 1)

          old_current = 'text = replace_once(text, "**chapitre 16 — Exports Godot et packaging**", "**chapitre 17 — Publication et distribution**", "index current")'
          new_current = 'text = replace_once(text, "- chapitre courant terminé : **chapitre 16 — Exports Godot et packaging** ;", "- chapitre courant terminé : **chapitre 17 — Publication et distribution** ;", "index current")'
          old_next = 'text = replace_once(text, "**chapitre 17 — Publication et distribution** ;", "**chapitre 18 — Accessibilité** ;", "index next")'
          new_next = 'text = replace_once(text, "- prochaine entrée du plan maître : **chapitre 17 — Publication et distribution** ;", "- prochaine entrée du plan maître : **chapitre 18 — Accessibilité** ;", "index next")'
          if text.count(old_current) != 1 or text.count(old_next) != 1:
              raise SystemExit('index replacement patterns not found exactly once')
          text = text.replace(old_current, new_current, 1).replace(old_next, new_next, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Finalize chapter lot
        id: finalize
        shell: bash
        run: |
          set +e
          python tools/temporary/finalize_l4_ch17.py > tools/temporary/ch17-finalizer.log 2>&1
          code=$?
          cat tools/temporary/ch17-finalizer.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload finalizer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-17-finalizer-log
          path: tools/temporary/ch17-finalizer.log

      - name: Assert finalizer success
        if: steps.finalize.outputs.exit_code != '0'
        run: exit 1

      - name: Commit permanent chapter lot
        if: steps.finalize.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(livre-iv): finaliser le chapitre 17 sur la publication"
          git push origin HEAD:docs/livre-iv-chapitre-17-publication-distribution
