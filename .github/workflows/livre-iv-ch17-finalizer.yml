name: Livre IV Chapter 17 Finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - tools/temporary/ch17.start
      - .github/workflows/livre-iv-ch17-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/livre-iv-chapitre-17-publication-distribution'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-17-publication-distribution
          fetch-depth: 0

      - name: Repair temporary Base64 padding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/temporary/finalize_l4_ch17.py')
          text = path.read_text(encoding='utf-8')
          old = 'return gzip.decompress(base64.b64decode(path.read_text(encoding="utf-8"))).decode("utf-8")'
          new = 'value = path.read_text(encoding="utf-8").strip()\n    value += "=" * (-len(value) % 4)\n    return gzip.decompress(base64.b64decode(value)).decode("utf-8")'
          if text.count(old) != 1:
              raise SystemExit('decode helper pattern not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Finalize chapter lot
        id: finalize
        shell: bash
        run: |
          set +e
          python tools/temporary/finalize_l4_ch17.py > tools/temporary/ch17-finalizer.log 2>&1
          code=$?
          cat tools/temporary/ch17-finalizer.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload finalizer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-17-finalizer-log
          path: tools/temporary/ch17-finalizer.log

      - name: Assert finalizer success
        if: steps.finalize.outputs.exit_code != '0'
        run: exit 1

      - name: Commit permanent chapter lot
        if: steps.finalize.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(livre-iv): finaliser le chapitre 17 sur la publication"
          git push origin HEAD:docs/livre-iv-chapitre-17-publication-distribution
