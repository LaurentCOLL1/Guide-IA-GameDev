name: Apply M8 Accessible PDF Finalization

on:
  push:
    branches: [feat/m8-tagged-accessible-pdf]
    paths:
      - ".github/scripts/apply_m8_accessible_finalization.py"
      - ".github/workflows/apply-m8-accessible-finalization.yml"

permissions:
  contents: write

concurrency:
  group: apply-m8-accessible-finalization
  cancel-in-progress: false

jobs:
  finalize-governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-tagged-accessible-pdf
          fetch-depth: 0

      - name: Apply exact governance updates
        run: python .github/scripts/apply_m8_accessible_finalization.py

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- contents.txt
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD.md ROADMAP.md CONTINUITE-PROJET.md
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs(m8): clôturer le PDF balisé"
          git push origin HEAD:feat/m8-tagged-accessible-pdf
