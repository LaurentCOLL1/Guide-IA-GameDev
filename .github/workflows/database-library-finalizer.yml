name: Temporary Database Library Materializer and Finalizer

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  materialize-and-finalize:
    if: >-
      github.event.pull_request.number == 412 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/companion-pack-database-library'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: Companion-Pack/Database-Library/python/src

    steps:
      - name: Checkout Database Library branch
        uses: actions/checkout@v4
        with:
          ref: feat/companion-pack-database-library
          fetch-depth: 0

      - name: Load materializer and finalizer from main
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/scripts/materialize_database_library.py > "$RUNNER_TEMP/materialize_database_library.py"
          git show origin/main:.github/scripts/finalize_database_library.py > "$RUNNER_TEMP/finalize_database_library.py"
          python3 -m py_compile "$RUNNER_TEMP/materialize_database_library.py" "$RUNNER_TEMP/finalize_database_library.py"

      - name: Materialize permanent Pack 5 files
        shell: bash
        run: python3 "$RUNNER_TEMP/materialize_database_library.py"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record runtime versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/database-library
          python -c 'import platform; print(platform.python_version())' | tee dist/database-library/python-version.txt
          python -c 'import sqlite3; print(sqlite3.sqlite_version)' | tee dist/database-library/sqlite-version.txt

      - name: Validate candidate runtime
        shell: bash
        run: |
          set -euo pipefail
          python Companion-Pack/Database-Library/tools/validate_database_library.py \
            --report dist/database-library/pre-final-static-validation.json
          python -m unittest discover \
            -s Companion-Pack/Database-Library/python/tests \
            -v 2>&1 | tee dist/database-library/python-tests.log
          grep -F "Ran 14 tests" dist/database-library/python-tests.log
          grep -F "OK" dist/database-library/python-tests.log

      - name: Exercise database lifecycle
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/database-library-runtime"
          mkdir -p "$WORK_DIR/backups" "$WORK_DIR/restored"
          python Companion-Pack/Database-Library/tools/init_database.py \
            "$WORK_DIR/asteria.sqlite3" \
            --with-synthetic-data \
            | tee dist/database-library/init.log
          python Companion-Pack/Database-Library/tools/backup_database.py \
            "$WORK_DIR/asteria.sqlite3" \
            "$WORK_DIR/backups/asteria-001.sqlite3" \
            | tee dist/database-library/backup.log
          python Companion-Pack/Database-Library/tools/restore_database.py \
            "$WORK_DIR/backups/asteria-001.sqlite3" \
            "$WORK_DIR/restored/asteria.sqlite3" \
            | tee dist/database-library/restore.log
          python Companion-Pack/Database-Library/tools/validate_database.py \
            "$WORK_DIR/restored/asteria.sqlite3" \
            | tee dist/database-library/validate.log
          grep -F '"status": "success"' dist/database-library/validate.log

      - name: Finalize Pack 5 and governance
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/finalize_database_library.py" \
            --run-id "$GITHUB_RUN_ID" \
            --python-version "$(cat dist/database-library/python-version.txt)" \
            --sqlite-version "$(cat dist/database-library/sqlite-version.txt)"

      - name: Run final lightweight validations
        shell: bash
        run: |
          set -euo pipefail
          python Companion-Pack/Database-Library/tools/validate_database_library.py \
            --report dist/database-library/final-static-validation.json
          python -m unittest discover \
            -s Companion-Pack/Database-Library/python/tests \
            -v
          python tools/validate_chapters.py --root . --report dist/QA-CHAPTERS.md
          python tools/validate_livre_v_references.py --check
          python tools/check_code_explanation_structure.py --check
          python tools/check_context_markers.py --check
          python tools/audit_contextes_semantiques.py --check
          python tools/report_contextes_utilisation.py > dist/QA-CONTEXTES-COUVERTURE.md
          test ! -e dist/Guide-IA-GameDev.pdf
          test -z "$(find Companion-Pack/Database-Library -type f -name '*.pdf' -print -quit)"
          test -z "$(find Companion-Pack/Database-Library -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \) -print -quit)"

      - name: Commit finalized Pack 5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Companion-Pack/Database-Library \
            Companion-Pack/index.md \
            plans/COMPANION-PACK-PLAN-MAITRE.md \
            ROADMAP.md \
            contents.txt \
            CONTINUITE-PROJET.md
          git diff --cached --check
          git commit -m "qa(database-library): finaliser le Pack 5 et la gouvernance"
          git push origin HEAD:feat/companion-pack-database-library

      - name: Upload Database Library evidence
        uses: actions/upload-artifact@v4
        with:
          name: database-library-finalization
          path: |
            dist/database-library
            dist/QA-CHAPTERS.md
            dist/QA-CONTEXTES-COUVERTURE.md
          if-no-files-found: error
          retention-days: 30
