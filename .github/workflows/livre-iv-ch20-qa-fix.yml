name: Livre IV Chapter 20 QA Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/livre-iv-ch20-qa-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'docs/livre-iv-chapitre-20-correctifs-mises-a-jour-retour-arriere'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-20-correctifs-mises-a-jour-retour-arriere
          fetch-depth: 0

      - name: Qualify diagnostics and align evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          chapter_path = Path('Livre-IV/CHAPITRE-20-Correctifs-mises-a-jour-et-retour-arriere.md')
          audit_path = Path('Livre-IV/QA/AUDIT-CHAPITRE-20.md')
          proof_path = Path('Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-20.yaml')

          chapter = chapter_path.read_text(encoding='utf-8')
          old = '## 52. Diagnostics : dix erreurs fréquentes\n\nChaque diagnostic suit'
          new = '## 52. Diagnostics : dix erreurs fréquentes\n\n<!-- qa:error-correction-section -->\n\nChaque diagnostic suit'
          if chapter.count(old) != 1:
              raise SystemExit('section de diagnostics introuvable ou ambiguë')
          chapter = chapter.replace(old, new, 1)
          chapter_path.write_text(chapter, encoding='utf-8', newline='\n')
          chapter_sha = hashlib.sha256(chapter.encode('utf-8')).hexdigest()
          chapter_lines = len(chapter.splitlines())

          audit = audit_path.read_text(encoding='utf-8')
          audit = re.sub(r'(?m)^\| Lignes \| \d+ \|$', f'| Lignes | {chapter_lines} |', audit, count=1)
          audit = re.sub(r'(?m)^\| Titres \| \d+ \|$', '| Titres | 68 |', audit, count=1)
          audit = re.sub(r'(?m)^\| Blocs significatifs \| \d+ \|$', '| Blocs significatifs | 43 |', audit, count=1)
          audit = re.sub(r'empreinte SHA-256 du chapitre : `[0-9a-f]{64}`', f'empreinte SHA-256 du chapitre : `{chapter_sha}`', audit, count=1)
          audit_path.write_text(audit, encoding='utf-8', newline='\n')
          audit_sha = hashlib.sha256(audit.encode('utf-8')).hexdigest()

          proof = proof_path.read_text(encoding='utf-8')
          proof = re.sub(r'(?m)^  chapter-lines: \d+$', f'  chapter-lines: {chapter_lines}', proof, count=1)
          proof = re.sub(r'(?m)^  chapter-headings: \d+$', '  chapter-headings: 68', proof, count=1)
          proof = re.sub(r'(?m)^  significant-code-and-data-blocks: \d+$', '  significant-code-and-data-blocks: 43', proof, count=1)
          proof = re.sub(r'(?m)^  chapter-sha256: [0-9a-f]{64}$', f'  chapter-sha256: {chapter_sha}', proof, count=1)
          proof = re.sub(r'(?m)^  audit-sha256: [0-9a-f]{64}$', f'  audit-sha256: {audit_sha}', proof, count=1)
          proof_path.write_text(proof, encoding='utf-8', newline='\n')

          print(f'chapter_lines={chapter_lines}')
          print(f'chapter_sha256={chapter_sha}')
          print(f'audit_sha256={audit_sha}')
          PY

      - name: Remove temporary corrector
        shell: bash
        run: rm .github/workflows/livre-iv-ch20-qa-fix.yml

      - name: Commit QA correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          materialized='Livre-IV/CHAPITRE-20-Correctifs-mises-a-jour-et-retour-arriere.md Livre-IV/QA/AUDIT-CHAPITRE-20.md Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-20.yaml '
          actual="$(git diff --cached --name-only --diff-filter=ACMRT | grep -v '^\.github/workflows/livre-iv-ch20-qa-fix.yml$' | sort | tr '\n' ' ')"
          test "$actual" = "$materialized"
          git commit -m "docs(ch20): qualifier la section de diagnostics"
          git push origin HEAD:docs/livre-iv-chapitre-20-correctifs-mises-a-jour-retour-arriere
