name: Livre IV Chapter 18 Continuity Metric Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - tools/temporary/ch18-continuity-metric-fix.start
      - .github/workflows/livre-iv-ch18-continuity-metric-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'docs/livre-iv-ch18-aligner-metric-continuite'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-ch18-aligner-metric-continuite
          fetch-depth: 0

      - name: Align continuity metric
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('CONTINUITE-PROJET.md')
          text = path.read_text(encoding='utf-8')
          old = '- métriques statiques : 2090 lignes, 66 titres, 59 blocs significatifs, 44 explications structurées et dix diagnostics ;'
          new = '- métriques statiques : 2090 lignes, 61 titres hors blocs, 59 blocs significatifs, 44 explications structurées et dix diagnostics ;'
          if text.count(old) != 1:
              raise SystemExit(f'motif attendu exactement une fois, trouvé {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Remove temporary corrector
        shell: bash
        run: |
          rm .github/workflows/livre-iv-ch18-continuity-metric-fix.yml
          rm tools/temporary/ch18-continuity-metric-fix.start

      - name: Commit continuity correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          expected='.github/workflows/livre-iv-ch18-continuity-metric-fix.yml CONTINUITE-PROJET.md tools/temporary/ch18-continuity-metric-fix.start '
          actual="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          test "$actual" = "$expected"
          git commit -m "docs(continuite): aligner la métrique du chapitre 18"
          git push origin HEAD:docs/livre-iv-ch18-aligner-metric-continuite
