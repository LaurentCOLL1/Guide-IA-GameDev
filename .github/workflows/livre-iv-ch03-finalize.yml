name: Livre IV Chapter 3 Finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.qa/finalize-livre-iv-ch03.py'
      - '.github/workflows/livre-iv-ch03-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-03-tests-regression
          fetch-depth: 1
      - name: Materialize chapter lot
        run: python .qa/finalize-livre-iv-ch03.py
      - name: Probe lightweight validators
        continue-on-error: true
        run: |
          python tools/validate_chapters.py
          python tools/check_code_explanation_structure.py
          python tools/check_context_markers.py
          python tools/audit_contextes_semantiques.py
          python tools/audit_contextes_utilisation.py
      - name: Assert reader boundaries
        run: |
          ! grep -qi 'GPT-5.6 Sol' Livre-IV/CHAPITRE-03-Tests-fonctionnels-et-tests-de-regression.md
          ! grep -qi 'Prochaine action' Livre-IV/CHAPITRE-03-Tests-fonctionnels-et-tests-de-regression.md
          ! grep -qi 'PDF' Livre-IV/CHAPITRE-03-Tests-fonctionnels-et-tests-de-regression.md
      - name: Commit provisional lot
        run: |
          rm .qa/finalize-livre-iv-ch03.py
          rm .github/workflows/livre-iv-ch03-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(livre-iv): matérialiser le chapitre 3 pour validation"
          git push origin HEAD:docs/livre-iv-chapitre-03-tests-regression
