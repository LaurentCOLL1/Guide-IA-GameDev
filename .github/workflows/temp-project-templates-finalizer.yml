name: Temporary Project Templates Finalizer

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 395 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/companion-pack-project-templates'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Project Templates branch
        uses: actions/checkout@v4
        with:
          ref: feat/companion-pack-project-templates
          fetch-depth: 0

      - name: Load finalizer from main
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/scripts/finalize_project_templates.py > "$RUNNER_TEMP/finalize_project_templates.py"

      - name: Finalize Pack 2 and governance
        shell: bash
        run: python3 "$RUNNER_TEMP/finalize_project_templates.py"

      - name: Validate documentation and Project Templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/project-templates
          python3 tools/validate_chapters.py --root . --report dist/QA-CHAPTERS.md
          python3 tools/validate_livre_v_references.py --check
          python3 tools/check_code_explanation_structure.py --check
          python3 tools/check_context_markers.py --check
          python3 tools/audit_contextes_semantiques.py --check
          python3 tools/report_contextes_utilisation.py > dist/QA-CONTEXTES-COUVERTURE.md
          python3 Companion-Pack/Project-Templates/tools/validate_templates.py \
            --report dist/project-templates/final-static-validation.json
          test ! -e dist/Guide-IA-GameDev.pdf

      - name: Commit finalized Pack 2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Companion-Pack/Project-Templates \
            Companion-Pack/index.md \
            plans/COMPANION-PACK-PLAN-MAITRE.md \
            ROADMAP.md \
            contents.txt \
            CONTINUITE-PROJET.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No finalization change to commit."
            exit 0
          fi
          git commit -m "qa(project-templates): finaliser le Pack 2"
          git push origin HEAD:feat/companion-pack-project-templates
