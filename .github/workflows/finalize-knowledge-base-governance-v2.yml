name: Finalize Knowledge Base Governance V2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/finalize-knowledge-base-governance-v2.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/companion-pack-knowledge-base'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/companion-pack-knowledge-base
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet PyYAML
      - name: Patch finalizer for bounded continuity and checksums
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/finalize_knowledge_base_governance.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("s=one(s,a,b,'cont next')","import re\ns,n=re.subn(r'(?s)(## 26\\. Prochaine action\\n\\n).*?(?=\\n## 27\\. Journal)',lambda m:m.group(1)+b+'\\n',s)\nif n!=1: raise RuntimeError(f'cont next regex: {n}')",1)
          anchor="E=os.environ.copy(); E['PYTHONDONTWRITEBYTECODE']='1'; E['PYTHONPATH']=str(R/'Companion-Pack/Knowledge-Base/python/src')"
          code="""import hashlib, json
P=R/'Companion-Pack/Knowledge-Base'; F={}
for q in sorted(P.rglob('*')):
 if q.is_file() and q.name!='checksums.json': F[q.relative_to(P).as_posix()]=hashlib.sha256(q.read_bytes()).hexdigest()
(P/'checksums.json').write_text(json.dumps({'algorithm':'sha256','files':F,'schema_version':1},indent=2,ensure_ascii=False,sort_keys=True)+'\\n',encoding='utf-8')
"""
          s=s.replace(anchor,code+anchor,1)
          s=s.replace("['git','add','ROADMAP.md','contents.txt','plans/COMPANION-PACK-PLAN-MAITRE.md','CONTINUITE-PROJET.md']","['git','add','ROADMAP.md','contents.txt','plans/COMPANION-PACK-PLAN-MAITRE.md','CONTINUITE-PROJET.md','Companion-Pack/Knowledge-Base/checksums.json']",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Finalize governance and validate
        run: python .github/scripts/finalize_knowledge_base_governance.py
