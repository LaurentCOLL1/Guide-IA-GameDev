name: Livre IV Chapter 1 PDF Leak Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: livre-iv-ch01-pdf-leak-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/livre-iv-ch01-retirer-mentions-pdf'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Detect pending correction
        id: gate
        shell: bash
        run: |
          if test -f .qa/fix-livre-iv-ch01-pdf-leak.py; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply reader-facing correction
        if: steps.gate.outputs.run == 'true'
        run: python3 .qa/fix-livre-iv-ch01-pdf-leak.py

      - name: Verify chapter contains no PDF reference
        if: steps.gate.outputs.run == 'true'
        run: |
          if grep -n "PDF" Livre-IV/CHAPITRE-01-Equilibrage-et-telemetrie-locale.md; then
            echo "Le chapitre lecteur contient encore une mention PDF." >&2
            exit 1
          fi

      - name: Run lightweight validators
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet PyYAML
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md
          python3 tools/check_code_explanation_structure.py --check
          python3 tools/check_context_markers.py --check
          python3 tools/audit_contextes_semantiques.py --check

      - name: Commit correction and remove temporary runner
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          rm -f .qa/fix-livre-iv-ch01-pdf-leak.py
          rm -f .github/workflows/livre-iv-ch01-pdf-leak-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(livre-iv): retirer les mentions PDF du chapitre 1"
          git push origin HEAD:${{ github.head_ref }}
