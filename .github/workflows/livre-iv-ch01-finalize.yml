name: Livre IV Chapter 1 Finalizer Runner

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

concurrency:
  group: livre-iv-ch01-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/livre-iv-chapitre-01-equilibrage-telemetrie'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install lightweight dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Finalize chapter governance and validators
        run: |
          set -euo pipefail
          test -f .qa/livre-iv-ch01-finalize.py
          python3 .qa/livre-iv-ch01-finalize.py

      - name: Validate structure, metadata, links and duplicates
        run: |
          set -euo pipefail
          mkdir -p dist
          set -o pipefail
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md \
            | tee dist/QA-CHAPTERS.log

      - name: Validate structured code explanations
        run: |
          set -euo pipefail
          set -o pipefail
          python3 tools/check_code_explanation_structure.py --check \
            | tee dist/QA-EXPLICATIONS-CODE.log

      - name: Audit usage marker presence
        run: |
          set -euo pipefail
          set -o pipefail
          python3 tools/check_context_markers.py --check \
            | tee dist/QA-CONTEXTES.log

      - name: Audit semantic marker consistency
        run: |
          set -euo pipefail
          set -o pipefail
          python3 tools/audit_contextes_semantiques.py --check \
            | tee dist/QA-CONTEXTES-SEMANTIQUES.log

      - name: Measure context coverage
        run: |
          set -euo pipefail
          set -o pipefail
          python3 tools/report_contextes_utilisation.py \
            | tee dist/QA-CONTEXTES-COUVERTURE.md

      - name: Assert that no PDF was produced
        run: |
          set -euo pipefail
          if find . -type f -name '*.pdf' -print -quit | grep -q .; then
            echo "Un PDF a été produit pendant une validation légère." >&2
            exit 1
          fi

      - name: Upload lightweight QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: livre-iv-ch01-validation-without-pdf
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/QA-CHAPTERS.md
            dist/QA-CHAPTERS.log
            dist/QA-EXPLICATIONS-CODE.log
            dist/QA-CONTEXTES.log
            dist/QA-CONTEXTES-SEMANTIQUES.log
            dist/QA-CONTEXTES-COUVERTURE.md

      - name: Commit finalized chapter lot
        run: |
          set -euo pipefail
          rm -f .qa/livre-iv-ch01-finalize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification de finalisation à committer."
            exit 0
          fi
          git commit -m "docs(livre-iv): finaliser le chapitre 1 et la gouvernance"
          git push origin HEAD:${{ github.head_ref }}
