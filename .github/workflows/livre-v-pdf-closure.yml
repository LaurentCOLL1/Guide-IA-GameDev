name: Livre V PDF Closure Runner

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  build-preflight-inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'qa/livre-v-pdf-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install PDF toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-recommended \
            fonts-dejavu fonts-liberation librsvg2-bin poppler-utils qpdf
          python3 -m pip install --disable-pip-version-check --quiet PyYAML pypdfium2 Pillow

      - name: Validate documentation before PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md
          python3 tools/validate_livre_v_references.py --check | tee dist/QA-LIVRE-V-REFERENCES.log
          python3 tools/check_code_explanation_structure.py --check
          python3 tools/check_context_markers.py --check
          python3 tools/audit_contextes_semantiques.py --check
          python3 tools/report_contextes_utilisation.py > dist/QA-CONTEXTES-COUVERTURE.md

      - name: Build cumulative reader PDF
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh 2>&1 | tee dist/BUILD-LOG.txt

      - name: Structural and reader preflight
        shell: bash
        run: |
          set -euo pipefail
          PDF=dist/Guide-IA-GameDev.pdf
          TEXT=dist/Guide-IA-GameDev.txt
          test -s "$PDF"
          qpdf --check "$PDF" | tee dist/QPDF-CHECK.txt
          pdfinfo "$PDF" | tee dist/PDF-INFO.txt
          pdffonts "$PDF" | tee dist/PDF-FONTS.txt
          pdftotext -layout "$PDF" "$TEXT"
          if grep -Eq "Audit post-création|VALIDATION-FINALE-CHAPITRE|VALIDATION-PUBLICATION-LIVRE|PROTOCOLE-FICHES-LIVRE-V|Protocole d.audit post-création" "$TEXT"; then
            echo "Internal QA content leaked into reader PDF." >&2
            exit 1
          fi
          if grep -Eq "Type 3|unknown" dist/PDF-FONTS.txt; then
            echo "Unexpected PDF font type detected." >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          text_path = Path('dist/Guide-IA-GameDev.txt')
          raw = text_path.read_text(encoding='utf-8', errors='replace')
          pages = raw.split('\f')
          if pages and not pages[-1].strip():
              pages.pop()

          def norm(value: str) -> str:
              return re.sub(r'\s+', ' ', value).strip()

          normalized_pages = [norm(page) for page in pages]
          source_paths = [Path('Livre-V/index.md')] + sorted(Path('Livre-V').glob('CHAPITRE-*.md'))
          chapter_paths = source_paths[1:]
          if len(chapter_paths) != 26:
              raise SystemExit(f'Expected 26 Livre V chapters, found {len(chapter_paths)}')

          entries = []
          missing = []
          for path in source_paths:
              source = path.read_text(encoding='utf-8')
              title = next((line[2:].strip() for line in source.splitlines() if line.startswith('# ')), None)
              if not title:
                  missing.append(f'{path}: missing H1')
                  continue
              needle = norm(title)
              matches = [i + 1 for i, page in enumerate(normalized_pages) if needle in page]
              if not matches:
                  missing.append(f'{path}: {title}')
                  continue
              entries.append({'path': str(path), 'title': title, 'page': matches[0], 'matches': matches})

          if missing:
              raise SystemExit('Livre V reader content missing:\n' + '\n'.join(missing))

          companion_path = Path('Companion-Pack/index.md')
          companion_title = next(
              (line[2:].strip() for line in companion_path.read_text(encoding='utf-8').splitlines() if line.startswith('# ')),
              None,
          )
          companion_pages = []
          if companion_title:
              needle = norm(companion_title)
              companion_pages = [i + 1 for i, page in enumerate(normalized_pages) if needle in page]

          starts = [entry['page'] for entry in entries]
          next_starts = starts[1:] + ([companion_pages[0]] if companion_pages else [len(pages) + 1])
          samples = set()
          for start, next_start in zip(starts, next_starts):
              samples.add(start)
              if start + 1 < next_start:
                  samples.add(start + 1)
              if next_start - start > 4:
                  samples.add((start + next_start - 1) // 2)
          book_last = (companion_pages[0] - 1) if companion_pages else len(pages)
          samples.add(book_last)
          if companion_pages:
              samples.add(companion_pages[0])

          ordered_samples = sorted(page for page in samples if 1 <= page <= len(pages))
          anchors = starts + [book_last]
          parity_indexes = sorted(set([0, 1, len(anchors)//4, len(anchors)//2, (3*len(anchors))//4, len(anchors)-2, len(anchors)-1]))
          parity_pages = sorted(set(anchors[index] for index in parity_indexes if 0 <= index < len(anchors)))

          payload = {
              'total_pdf_pages': len(pages),
              'livre_v_entries': entries,
              'companion_pack_title': companion_title,
              'companion_pack_pages': companion_pages,
              'livre_v_last_page': book_last,
              'sample_pages': ordered_samples,
              'parity_pages': parity_pages,
          }
          Path('dist/LIVRE-V-PAGE-MAP.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('dist/LIVRE-V-PAGE-MAP.tsv').write_text(
              'page\tpath\ttitle\n' + ''.join(f"{entry['page']}\t{entry['path']}\t{entry['title']}\n" for entry in entries),
              encoding='utf-8',
          )
          Path('dist/SAMPLE-PAGES.txt').write_text(','.join(map(str, ordered_samples)) + '\n', encoding='utf-8')
          Path('dist/PARITY-PAGES.txt').write_text(','.join(map(str, parity_pages)) + '\n', encoding='utf-8')
          print(f'All 26 Livre V chapter titles and the index are present. Sample pages: {len(ordered_samples)}.')
          PY
          sha256sum "$PDF" | tee dist/Guide-IA-GameDev.pdf.sha256
          sha256sum "$TEXT" | tee dist/Guide-IA-GameDev.txt.sha256
          stat --printf='size_bytes=%s\n' "$PDF" | tee dist/PDF-METRICS.txt
          pdfinfo "$PDF" | awk -F: '/^Pages|^Page size|^Encrypted|^Tagged|^PDF version/ {gsub(/^[ \t]+/, "", $2); print $1 "=" $2}' | tee -a dist/PDF-METRICS.txt

      - name: Render representative pages with Poppler
        shell: bash
        run: |
          set -euo pipefail
          PDF=dist/Guide-IA-GameDev.pdf
          mkdir -p dist/visual-poppler
          IFS=',' read -ra PAGES <<< "$(cat dist/SAMPLE-PAGES.txt)"
          for page in "${PAGES[@]}"; do
            printf -v label '%04d' "$page"
            pdftoppm -f "$page" -l "$page" -r 120 -png -singlefile "$PDF" "dist/visual-poppler/page-$label"
          done

      - name: Render parity pages with PDFium
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pypdfium2 as pdfium

          pdf_path = Path('dist/Guide-IA-GameDev.pdf')
          out = Path('dist/visual-pdfium')
          out.mkdir(parents=True, exist_ok=True)
          pages = [int(value) for value in Path('dist/PARITY-PAGES.txt').read_text().strip().split(',') if value]
          doc = pdfium.PdfDocument(str(pdf_path))
          for page_number in pages:
              page = doc[page_number - 1]
              bitmap = page.render(scale=120 / 72)
              bitmap.to_pil().save(out / f'page-{page_number:04d}.png')
          PY

      - name: Build visual contact sheets and metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageStat
          import csv
          import math

          source = Path('dist/visual-poppler')
          paths = sorted(source.glob('page-*.png'))
          metrics_path = Path('dist/VISUAL-METRICS.csv')
          rows = []
          thumbs = []
          for path in paths:
              image = Image.open(path).convert('RGB')
              gray = image.convert('L')
              stat = ImageStat.Stat(gray)
              rows.append([path.name, image.width, image.height, round(stat.mean[0], 3), round(stat.rms[0], 3)])
              thumb = image.copy()
              thumb.thumbnail((260, 368))
              thumbs.append((path.stem.replace('page-', 'p. '), thumb))
          with metrics_path.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.writer(handle)
              writer.writerow(['file', 'width', 'height', 'gray_mean', 'gray_rms'])
              writer.writerows(rows)

          font = ImageFont.load_default()
          per_sheet = 20
          for sheet_index in range(math.ceil(len(thumbs) / per_sheet)):
              group = thumbs[sheet_index * per_sheet:(sheet_index + 1) * per_sheet]
              canvas = Image.new('RGB', (4 * 290, 5 * 410), 'white')
              draw = ImageDraw.Draw(canvas)
              for index, (label, thumb) in enumerate(group):
                  col = index % 4
                  row = index // 4
                  x = col * 290 + 15
                  y = row * 410 + 15
                  draw.text((x, y), label, fill='black', font=font)
                  canvas.paste(thumb, (x, y + 20))
              canvas.save(Path('dist') / f'LIVRE-V-CONTACT-SHEET-{sheet_index + 1:02d}.jpg', quality=88)
          PY
          find dist/visual-poppler dist/visual-pdfium -type f -name '*.png' -print0 | sort -z | xargs -0 sha256sum > dist/RENDER-HASHES.txt

      - name: Upload Livre V closure candidate
        uses: actions/upload-artifact@v4
        with:
          name: livre-v-reader-pdf-candidate
          path: |
            dist/Guide-IA-GameDev.pdf
            dist/Guide-IA-GameDev.pdf.sha256
            dist/Guide-IA-GameDev.txt
            dist/Guide-IA-GameDev.txt.sha256
            dist/PDF-INFO.txt
            dist/PDF-FONTS.txt
            dist/PDF-METRICS.txt
            dist/QPDF-CHECK.txt
            dist/BUILD-LOG.txt
            dist/QA-CHAPTERS.md
            dist/QA-LIVRE-V-REFERENCES.log
            dist/QA-CONTEXTES-COUVERTURE.md
            dist/LIVRE-V-PAGE-MAP.json
            dist/LIVRE-V-PAGE-MAP.tsv
            dist/SAMPLE-PAGES.txt
            dist/PARITY-PAGES.txt
            dist/VISUAL-METRICS.csv
            dist/RENDER-HASHES.txt
            dist/LIVRE-V-CONTACT-SHEET-*.jpg
            dist/visual-poppler/*.png
            dist/visual-pdfium/*.png
          if-no-files-found: error
          retention-days: 30
