name: Livre V YAML Source Diagnostic

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose-reader-sources:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'qa/livre-v-pdf-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Pandoc
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Parse every reader source independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r source; do
            source="${source#${source%%[![:space:]]*}}"
            source="${source%${source##*[![:space:]]}}"
            [[ -z "$source" || "$source" == \#* ]] && continue
            echo "Parsing $source"
            if ! pandoc --from=markdown+yaml_metadata_block --to=native "$source" --output=/dev/null 2>dist/PANDOC-SOURCE-ERROR.txt; then
              echo "PANDOC_SOURCE_FAILED=$source" >&2
              cat dist/PANDOC-SOURCE-ERROR.txt >&2
              exit 1
            fi
          done < contents.txt
          echo "All reader sources parse independently."
