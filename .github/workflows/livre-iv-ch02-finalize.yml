name: Livre IV Chapter 2 Finalizer

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

concurrency:
  group: livre-iv-ch02-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/livre-iv-chapitre-02-strategie-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Detect pending finalizer
        id: gate
        shell: bash
        run: |
          if test -f .qa/finalize-livre-iv-ch02.py; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Le finaliseur éphémère a déjà été supprimé."
          fi

      - name: Install lightweight dependencies
        if: steps.gate.outputs.run == 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Materialize chapter lot
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 .qa/finalize-livre-iv-ch02.py

      - name: Assert reader boundaries
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          chapter="Livre-IV/CHAPITRE-02-Strategie-generale-d-assurance-qualite.md"
          if grep -Eqi '\bpdf\b|GPT-5\.6|Prochaine étape' "$chapter"; then
            echo "Le chapitre contient une instruction de production ou d'export interdite." >&2
            exit 1
          fi

      - name: Validate structure metadata links and duplicates
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          set -o pipefail
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md | tee dist/QA-CHAPTERS.log

      - name: Validate structured explanations
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          set -o pipefail
          python3 tools/check_code_explanation_structure.py --check | tee dist/QA-EXPLICATIONS-CODE.log

      - name: Audit usage markers
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          set -o pipefail
          python3 tools/check_context_markers.py --check | tee dist/QA-CONTEXTES.log

      - name: Audit semantic marker consistency
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          set -o pipefail
          python3 tools/audit_contextes_semantiques.py --check | tee dist/QA-CONTEXTES-SEMANTIQUES.log

      - name: Measure context coverage
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          set -o pipefail
          python3 tools/report_contextes_utilisation.py | tee dist/QA-CONTEXTES-COUVERTURE.md

      - name: Assert lightweight validation produced no PDF
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          if find . -type f -name '*.pdf' -print -quit | grep -q .; then
            echo "Un PDF a été produit pendant la validation légère." >&2
            exit 1
          fi

      - name: Upload QA evidence
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: livre-iv-ch02-validation-without-pdf
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/QA-CHAPTERS.md
            dist/QA-CHAPTERS.log
            dist/QA-EXPLICATIONS-CODE.log
            dist/QA-CONTEXTES.log
            dist/QA-CONTEXTES-SEMANTIQUES.log
            dist/QA-CONTEXTES-COUVERTURE.md

      - name: Commit finalized chapter lot
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          rm -f .qa/ch02.part0 .qa/ch02.part1 .qa/ch02.part2 .qa/ch02.part3 .qa/ch02.part4
          rm -f .qa/finalize-livre-iv-ch02.py
          rm -f .github/workflows/livre-iv-ch02-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(livre-iv): finaliser le chapitre 2 et sa gouvernance"
          git push origin HEAD:${{ github.head_ref }}
