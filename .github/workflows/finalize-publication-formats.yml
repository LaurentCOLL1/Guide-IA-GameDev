name: Finalize Publication Formats

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/finalize_publication_formats.py"
      - ".github/workflows/finalize-publication-formats.yml"
      - "tools/validate_licenses.py"

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/publication-formats-pdf-html-epub'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/publication-formats-pdf-html-epub
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet PyYAML
      - name: Finalize qualified publication formats
        run: python .github/scripts/finalize_publication_formats.py
