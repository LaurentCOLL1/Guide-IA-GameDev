name: Temporary ComfyUI Library Finalizer

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 417 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/companion-pack-comfyui-library'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout ComfyUI Library branch
        uses: actions/checkout@v4
        with:
          ref: feat/companion-pack-comfyui-library
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight documentation dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Finalize Pack 6 and governance
        shell: bash
        run: python .github/scripts/finalize_comfyui_library.py

      - name: Run final lightweight validations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/comfyui-library-final
          python Companion-Pack/ComfyUI-Library/tools/validate_comfyui_library.py \
            --report dist/comfyui-library-final/static-validation.json
          python -m unittest discover \
            -s Companion-Pack/ComfyUI-Library/python/tests \
            -v 2>&1 | tee dist/comfyui-library-final/python-tests.log
          grep -F "Ran 12 tests" dist/comfyui-library-final/python-tests.log
          grep -F "OK" dist/comfyui-library-final/python-tests.log
          python tools/validate_chapters.py \
            --root . \
            --report dist/QA-CHAPTERS.md
          python tools/validate_livre_v_references.py --check
          python tools/check_code_explanation_structure.py --check
          python tools/check_context_markers.py --check
          python tools/audit_contextes_semantiques.py --check
          python tools/report_contextes_utilisation.py \
            > dist/QA-CONTEXTES-COUVERTURE.md
          test ! -e dist/Guide-IA-GameDev.pdf
          test -z "$(find Companion-Pack/ComfyUI-Library \
            -type f -name '*.pdf' -print -quit)"

      - name: Remove temporary finalizer
        shell: bash
        run: |
          rm .github/scripts/finalize_comfyui_library.py
          rm .github/workflows/comfyui-library-finalizer.yml

      - name: Commit finalized Pack 6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            Companion-Pack/ComfyUI-Library \
            Companion-Pack/index.md \
            plans/COMPANION-PACK-PLAN-MAITRE.md \
            ROADMAP.md \
            contents.txt \
            CONTINUITE-PROJET.md \
            .github/scripts/finalize_comfyui_library.py \
            .github/workflows/comfyui-library-finalizer.yml
          git diff --cached --check
          git commit -m "qa(comfyui-library): finaliser le Pack 6 et la gouvernance"
          git push origin HEAD:feat/companion-pack-comfyui-library
