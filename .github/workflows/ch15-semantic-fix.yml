name: Livre IV Chapter 15 Semantic Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'docs/livre-iv-chapitre-15-sauvegardes-migrations-reprise' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-15-sauvegardes-migrations-reprise
          fetch-depth: 0

      - name: Correct the six reported markers
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path

          path = Path('Livre-IV/CHAPITRE-15-Sauvegardes-migrations-et-reprise-apres-incident.md')
          text = path.read_text(encoding='utf-8')

          exact = {
              '> **[DCT] Terminal dans un conteneur de diagnostic non privilégié — Adapter le chemin attendu.**':
              '> **[WSL] Terminal Bash ouvert dans le conteneur de diagnostic non privilégié — Adapter le chemin attendu.**',
              '> **[WEB] Navigateur — Vérifier les procédures des moteurs avant matérialisation.**':
              '> **[APP] Navigateur web — Vérifier les procédures des moteurs avant matérialisation.**',
              '> **[DCT] Exemple corrigé — Adapter le nom isolé.**':
              '> **[WSL] Exemple corrigé — Adapter le nom isolé dans un terminal Bash.**',
              '> **[DCT] Exemple corrigé — Adapter les oracles métier.**':
              '> **[WSL] Exemple corrigé — Adapter les oracles métier dans un terminal Bash.**',
          }
          for old, new in exact.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'repère attendu une fois, trouvé {count}: {old}')
              text = text.replace(old, new)

          old = '> **[DCT] Exemple fautif — Ne pas appliquer.**'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'exemples fautifs DCT attendus deux fois, trouvés {count}')
          text = text.replace(old, '> **[WSL] Exemple fautif — Ne pas appliquer dans un terminal Bash.**')

          path.write_text(text, encoding='utf-8', newline='\n')
          Path('/tmp/ch15-chapter-sha256.txt').write_text(sha256(path.read_bytes()).hexdigest(), encoding='ascii')

      - name: Remove workflow and commit corrected chapter
        id: content
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ch15-semantic-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Livre-IV/CHAPITRE-15-Sauvegardes-migrations-et-reprise-apres-incident.md .github/workflows/ch15-semantic-fix.yml
          git commit -m "docs(ch15): corriger les repères sémantiques"
          CONTENT_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:docs/livre-iv-chapitre-15-sauvegardes-migrations-reprise
          echo "content_sha=$CONTENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Refresh evidence for corrected content
        env:
          CONTENT_SHA: ${{ steps.content.outputs.content_sha }}
        shell: python
        run: |
          import os
          from pathlib import Path

          proof = Path('Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-15.yaml')
          text = proof.read_text(encoding='utf-8')
          chapter_hash = Path('/tmp/ch15-chapter-sha256.txt').read_text(encoding='ascii').strip()

          import re
          text, count = re.subn(r'validated-head-commit: [0-9a-f]{40}', f'validated-head-commit: {os.environ["CONTENT_SHA"]}', text)
          if count != 1:
              raise SystemExit(f'validated-head-commit: attendu 1, trouvé {count}')
          text, count = re.subn(r'  chapter-sha256: [0-9a-f]{64}', f'  chapter-sha256: {chapter_hash}', text)
          if count != 1:
              raise SystemExit(f'chapter-sha256: attendu 1, trouvé {count}')
          text, count = re.subn(
              r'  validate-chapters-without-pdf:\n    workflow-name: Validate Chapters Without PDF\n    execution: permanent-workflow\n    run-id: [^\n]+\n    conclusion: [^\n]+',
              '  validate-chapters-without-pdf:\n    workflow-name: Validate Chapters Without PDF\n    execution: permanent-workflow\n    run-id: pending-after-semantic-fix\n    conclusion: pending',
              text,
          )
          if count != 1:
              raise SystemExit(f'bloc workflow permanent: attendu 1, trouvé {count}')
          text, count = re.subn(
              r'evidence-closure:\n  commit: [0-9a-f]{40}\n  conclusion: success',
              f'evidence-closure:\n  commit: {os.environ["CONTENT_SHA"]}\n  conclusion: success',
              text,
          )
          if count != 1:
              raise SystemExit(f'evidence-closure: attendu 1, trouvé {count}')
          proof.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit refreshed evidence
        run: |
          set -euo pipefail
          git add Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-15.yaml
          git commit -m "docs(qa): actualiser la preuve du chapitre 15"
          git push origin HEAD:docs/livre-iv-chapitre-15-sauvegardes-migrations-reprise
