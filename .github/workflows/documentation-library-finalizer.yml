name: Temporary Documentation Library Finalizer

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 418 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/companion-pack-documentation-library'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout Documentation Library branch
        uses: actions/checkout@v4
        with:
          ref: feat/companion-pack-documentation-library
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight documentation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet PyYAML
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc

      - name: Finalize Pack 7 and governance
        shell: bash
        run: python .github/scripts/finalize_documentation_library.py

      - name: Run final Pack validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/documentation-library-final
          python Companion-Pack/Documentation-Library/scripts/validate_documentation_library.py \
            --report dist/documentation-library-final/static-validation.json
          python -m unittest discover \
            -s Companion-Pack/Documentation-Library/tests \
            -v 2>&1 | tee dist/documentation-library-final/python-tests.log
          grep -F "Ran 18 tests" dist/documentation-library-final/python-tests.log
          grep -F "OK" dist/documentation-library-final/python-tests.log

      - name: Regenerate and compile examples
        shell: bash
        run: |
          set -euo pipefail
          PACK="$GITHUB_WORKSPACE/Companion-Pack/Documentation-Library"
          RUNTIME="$RUNNER_TEMP/documentation-library-final"
          mkdir -p "$RUNTIME/generated" "$RUNTIME/html"
          python "$PACK/scripts/generate_document.py" \
            --root "$PACK" \
            --plan examples/generation-plan.json \
            --output-root "$RUNTIME/generated"
          python - <<'PY'
          import json, os
          from pathlib import Path
          pack = Path("Companion-Pack/Documentation-Library")
          generated = Path(os.environ["RUNNER_TEMP"]) / "documentation-library-final/generated"
          plan = json.loads((pack / "examples/generation-plan.json").read_text(encoding="utf-8"))
          for job in plan["jobs"]:
              expected = pack / job["output"]
              actual = generated / expected.name
              if expected.read_bytes() != actual.read_bytes():
                  raise SystemExit(f"generated example differs: {expected}")
          print(f"DETERMINISTIC_GENERATION: PASS ({len(plan['jobs'])} examples)")
          PY
          count=0
          for source in "$RUNTIME/generated"/*.md; do
            name="$(basename "$source" .md)"
            pandoc "$source" --from markdown --to html --standalone \
              --output "$RUNTIME/html/$name.html"
            count=$((count + 1))
          done
          test "$count" -eq 9
          test "$(find "$RUNTIME/html" -type f -name '*.html' | wc -l)" -eq 9
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          generated = Path(os.environ["RUNNER_TEMP"]) / "documentation-library-final/generated"
          proofs = list(generated.glob("*.yaml"))
          assert len(proofs) == 1
          assert isinstance(yaml.safe_load(proofs[0].read_text(encoding="utf-8")), dict)
          print("PANDOC_HTML_COMPILATION: PASS (9 documents)")
          PY

      - name: Run final lightweight repository validations
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_chapters.py --root . --report dist/QA-CHAPTERS.md
          python tools/validate_livre_v_references.py --check
          python tools/check_code_explanation_structure.py --check
          python tools/check_context_markers.py --check
          python tools/audit_contextes_semantiques.py --check
          python tools/report_contextes_utilisation.py > dist/QA-CONTEXTES-COUVERTURE.md
          test ! -e dist/Guide-IA-GameDev.pdf
          test -z "$(find Companion-Pack/Documentation-Library \
            -type f \( -name '*.pdf' -o -name '*.docx' -o -name '*.epub' \) -print -quit)"

      - name: Remove temporary finalizer
        shell: bash
        run: |
          rm .github/scripts/finalize_documentation_library.py
          rm .github/workflows/documentation-library-finalizer.yml

      - name: Commit finalized Pack 7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            Companion-Pack/Documentation-Library \
            Companion-Pack/index.md \
            plans/COMPANION-PACK-PLAN-MAITRE.md \
            ROADMAP.md \
            contents.txt \
            CONTINUITE-PROJET.md \
            .github/scripts/finalize_documentation_library.py \
            .github/workflows/documentation-library-finalizer.yml
          git diff --cached --check
          git commit -m "qa(documentation-library): finaliser le Pack 7 et la gouvernance"
          git push origin HEAD:feat/companion-pack-documentation-library
