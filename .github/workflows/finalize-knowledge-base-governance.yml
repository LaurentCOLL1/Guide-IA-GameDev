name: Finalize Knowledge Base Governance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/finalize_knowledge_base_governance.py"
      - ".github/scripts/finalize_knowledge_base.trigger"
      - ".github/workflows/finalize-knowledge-base-governance.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/companion-pack-knowledge-base'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/companion-pack-knowledge-base
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet PyYAML
      - name: Normalize bounded replacements and checksums
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/finalize_knowledge_base_governance.py')
          s=p.read_text(encoding='utf-8')
          old="s=one(s,a,b,'cont next')"
          new="import re\ns,n=re.subn(r'(?s)(## 26\\. Prochaine action\\n\\n).*?(?=\\n## 27\\. Journal)',lambda m:m.group(1)+b+'\\n',s)\nif n!=1: raise RuntimeError(f'cont next regex: {n}')"
          if s.count(old)!=1:
              raise SystemExit('continuity patch target missing')
          s=s.replace(old,new,1)
          anchor="E=os.environ.copy(); E['PYTHONDONTWRITEBYTECODE']='1'; E['PYTHONPATH']=str(R/'Companion-Pack/Knowledge-Base/python/src')"
          checksum_code="""import hashlib, json
P=R/'Companion-Pack/Knowledge-Base'
F={}
for q in sorted(P.rglob('*')):
 if q.is_file() and q.name!='checksums.json': F[q.relative_to(P).as_posix()]=hashlib.sha256(q.read_bytes()).hexdigest()
(P/'checksums.json').write_text(json.dumps({'algorithm':'sha256','files':F,'schema_version':1},indent=2,ensure_ascii=False,sort_keys=True)+'\\n',encoding='utf-8')
"""
          if s.count(anchor)!=1:
              raise SystemExit('checksum insertion target missing')
          s=s.replace(anchor,checksum_code+anchor,1)
          old_add="['git','add','ROADMAP.md','contents.txt','plans/COMPANION-PACK-PLAN-MAITRE.md','CONTINUITE-PROJET.md']"
          new_add="['git','add','ROADMAP.md','contents.txt','plans/COMPANION-PACK-PLAN-MAITRE.md','CONTINUITE-PROJET.md','Companion-Pack/Knowledge-Base/checksums.json']"
          if s.count(old_add)!=1:
              raise SystemExit('git add patch target missing')
          p.write_text(s.replace(old_add,new_add,1),encoding='utf-8')
          PY
      - name: Finalize governance and validate
        run: python .github/scripts/finalize_knowledge_base_governance.py
