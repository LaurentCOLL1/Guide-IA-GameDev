name: Finalize Global Licensing Governance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/finalize_global_licensing.py"
      - ".github/workflows/finalize-global-licensing.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/global-licensing-policy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-licensing-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet PyYAML
      - run: python .github/scripts/finalize_global_licensing.py
