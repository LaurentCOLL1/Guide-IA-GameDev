name: Livre IV Chapter 19 Finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - tools/temporary/ch19.finalize.start

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/livre-iv-chapitre-19-localisation-internationalisation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-19-localisation-internationalisation
          fetch-depth: 0

      - name: Materialize and audit permanent lot
        shell: bash
        run: |
          set -euo pipefail
          cat tools/temporary/ch19.finalizer.*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > /tmp/finalize_l4_ch19.py
          python /tmp/finalize_l4_ch19.py

      - name: Commit permanent chapter lot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          permanent='CONTINUITE-PROJET.md Livre-IV/CHAPITRE-19-Localisation-et-internationalisation.md Livre-IV/QA/AUDIT-CHAPITRE-19.md Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-19.yaml Livre-IV/index.md ROADMAP.md contents.txt plans/LIVRE-IV-PLAN-MAITRE.md '
          final_diff="$(git diff --cached --name-only --diff-filter=ACMRT | grep -v '^\.github/workflows/livre-iv-ch19-finalizer.yml$' | grep -v '^tools/temporary/ch19' | sort | tr '\n' ' ')"
          test "$final_diff" = "$permanent"
          git commit -m "docs(livre-iv): créer le chapitre 19 sur la localisation"
          git push origin HEAD:docs/livre-iv-chapitre-19-localisation-internationalisation
