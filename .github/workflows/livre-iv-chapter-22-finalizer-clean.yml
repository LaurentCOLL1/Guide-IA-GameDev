name: Livre IV Chapter 22 Finalizer Clean

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - tools/temporary/ch22.clean.start

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/livre-iv-chapitre-22-maintenance-archivage-perennite'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-22-maintenance-archivage-perennite
          fetch-depth: 0

      - name: Decode and run finalizer
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/ch22-finalizer.log) 2>&1
          set -x
          cat <<'SHA256' | sha256sum --check -
          850bac4e7bd53fac4f368445447c003da0d25c9997e6010218f6e6fa90cdeae0  tools/temporary/ch22.clean.payload.001.b64
          69658b1fde64f8f4a746c722effa6e246e840c7aa245f10e89fae2df6a5e7083  tools/temporary/ch22.clean.payload.002.b64
          eeb1d5345198e8ba15472a436db345e297cd40dd3473cbc929329befb9fa0ecf  tools/temporary/ch22.clean.payload.003.b64
          13e1ec96cc9908dc51339bdfebba7ef079404c8f4c66236908b21cb539111e53  tools/temporary/ch22.clean.payload.004.b64
          bad55401ba7b9201b67ac83de02c1a5bda5583d29facaca6b7ee89fae378fe63  tools/temporary/ch22.clean.payload.005.b64
          ab8bf36d860861945693ae4fd4d9d2d817f8dc3290a0822767db10d96f8412f1  tools/temporary/ch22.clean.payload.006.b64
          27256e6dcc55549dc2fe83595d2f1ffadc133446fe48d7ddcac8eea5afcf2145  tools/temporary/ch22.clean.payload.007.b64
          82d663ba4a6b9489ad5c8e18facd26290cb65ce2166f92da0ba74d7ce9d8b7b9  tools/temporary/ch22.clean.payload.008.b64
          33cf40bbd151d8b01a9e35d3b414db8cdde34947ea96e226dcfc9d773aff0fb0  tools/temporary/ch22.clean.payload.009.b64
          SHA256
          cat tools/temporary/ch22.clean.finalizer.*.b64 \
            | tr -d '\n' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/finalize_l4_ch22.py
          echo "9ffe216226234acfbe73f97c09ec880b8cf426ac3510f6f7a3b58a5983564da9  /tmp/finalize_l4_ch22.py" | sha256sum --check -
          python -m py_compile /tmp/finalize_l4_ch22.py
          python /tmp/finalize_l4_ch22.py

      - name: Upload finalizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-22-finalizer-clean
          path: /tmp/ch22-finalizer.log

      - name: Commit permanent chapter lot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(livre-iv): créer le chapitre 22 sur la pérennité"
          git push origin HEAD:docs/livre-iv-chapitre-22-maintenance-archivage-perennite
