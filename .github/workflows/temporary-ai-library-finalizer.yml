name: Temporary AI Library Finalizer

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 400 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/companion-pack-ai-library'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: Companion-Pack/AI-Library/src

    steps:
      - name: Checkout AI Library branch
        uses: actions/checkout@v4
        with:
          ref: feat/companion-pack-ai-library
          fetch-depth: 0

      - name: Load corrected finalizer from main
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/scripts/finalize_ai_library.py > "$RUNNER_TEMP/finalize_ai_library.py"
          python3 - "$RUNNER_TEMP/finalize_ai_library.py" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "    ('status: \"candidate\"', 'status: \"reviewed\"', \"README status\"),"
          new = "    ('id: \"CP-PACK-03-AI-LIBRARY\"\\nstatus: \"candidate\"', 'id: \"CP-PACK-03-AI-LIBRARY\"\\nstatus: \"reviewed\"', \"README status\"),"
          if text.count(old) != 1:
              raise SystemExit("README status tuple not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          python3 -m py_compile "$RUNNER_TEMP/finalize_ai_library.py"

      - name: Finalize Pack 3 and governance
        shell: bash
        run: python3 "$RUNNER_TEMP/finalize_ai_library.py"

      - name: Validate documentation and AI Library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ai-library
          python3 tools/validate_chapters.py --root . --report dist/QA-CHAPTERS.md
          python3 tools/validate_livre_v_references.py --check
          python3 tools/check_code_explanation_structure.py --check
          python3 tools/check_context_markers.py --check
          python3 tools/audit_contextes_semantiques.py --check
          python3 tools/report_contextes_utilisation.py > dist/QA-CONTEXTES-COUVERTURE.md
          python3 Companion-Pack/AI-Library/tools/validate_ai_library.py \
            --report dist/ai-library/final-static-validation.json
          python3 -m unittest discover \
            -s Companion-Pack/AI-Library/tests \
            -v
          test ! -e dist/Guide-IA-GameDev.pdf

      - name: Commit finalized Pack 3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Companion-Pack/AI-Library \
            Companion-Pack/index.md \
            plans/COMPANION-PACK-PLAN-MAITRE.md \
            ROADMAP.md \
            contents.txt \
            CONTINUITE-PROJET.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No finalization change to commit."
            exit 0
          fi
          git commit -m "qa(ai-library): finaliser le Pack 3"
          git push origin HEAD:feat/companion-pack-ai-library
