name: Livre IV Chapter 21 Explanation Corrector

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - tools/temporary/ch21.explanations.fix

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'docs/livre-iv-chapitre-21-modding-contenu-communautaire'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-21-modding-contenu-communautaire
          fetch-depth: 0

      - name: Correct diagnostic explanation rubrics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          chapter_path = Path('Livre-IV/CHAPITRE-21-Modding-et-contenu-communautaire.md')
          audit_path = Path('Livre-IV/QA/AUDIT-CHAPITRE-21.md')
          proof_path = Path('Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-21.yaml')

          old_chapter_sha = 'a50948db57384c7e4c0361d93a8ac5af36e0e9b0af517d391b1f39d3b9b7634d'
          old_audit_sha = '013a068d468a261be430604ce31dd774f5cc7545af6bf33824ed2dcf6df699ab'
          expected_chapter_sha = '964faaa7b0bb73f57febe16c5737bddf638f2f8aa71c7a9f73fae6fd143e8f6d'
          expected_audit_sha = 'b63ea91746eb50240f0c3fb359f095e8a2dbb763a46dc995d5fa996cf507ce66'

          chapter = chapter_path.read_text(encoding='utf-8')
          faulty = '**Pourquoi cet exemple est fautif :**'
          corrected = '**Pourquoi la correction fonctionne :**'
          assert chapter.count(faulty) == 10
          assert chapter.count(corrected) == 10
          chapter = chapter.replace(faulty, '**Explication structurée du bloc :**')
          chapter = chapter.replace(corrected, '**Explication structurée du bloc :**')
          assert chapter.count('<!-- qa:code-explanation -->') == 43
          assert chapter.count('**Explication structurée du bloc :**') == 43
          chapter_sha = hashlib.sha256(chapter.encode()).hexdigest()
          assert chapter_sha == expected_chapter_sha, chapter_sha
          chapter_path.write_text(chapter, encoding='utf-8')

          audit = audit_path.read_text(encoding='utf-8')
          assert audit.count(old_chapter_sha) == 1
          audit = audit.replace(old_chapter_sha, chapter_sha)
          audit_sha = hashlib.sha256(audit.encode()).hexdigest()
          assert audit_sha == expected_audit_sha, audit_sha
          audit_path.write_text(audit, encoding='utf-8')

          proof = proof_path.read_text(encoding='utf-8')
          assert proof.count(old_chapter_sha) == 1
          assert proof.count(old_audit_sha) == 1
          proof = proof.replace(old_chapter_sha, chapter_sha)
          proof = proof.replace(old_audit_sha, audit_sha)
          proof_path.write_text(proof, encoding='utf-8')

          Path('.github/workflows/livre-iv-ch21-explanations-corrector.yml').unlink()
          Path('tools/temporary/ch21.explanations.fix').unlink()
          print(f'chapter_sha256={chapter_sha}')
          print(f'audit_sha256={audit_sha}')
          PY

      - name: Commit corrected permanent lot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(ch21): aligner les rubriques d’explication structurée"
          git push origin HEAD:docs/livre-iv-chapitre-21-modding-contenu-communautaire
