name: Livre IV PDF Closure Finalizer

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .qa/livre-iv-pdf-finalize-v2.trigger

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'qa/livre-iv-pdf-closure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/livre-iv-pdf-closure
          fetch-depth: 0
      - name: Run standalone closure finalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet PyYAML
          python3 .qa/livre-iv-pdf-finalize.py
          python3 tools/validate_chapters.py --report /tmp/l4-closure-chapters.md
          python3 tools/check_code_explanation_structure.py --check
          python3 tools/check_context_markers.py --check
          python3 tools/audit_contextes_semantiques.py --check
      - name: Commit permanent closure lot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "qa(livre-iv): clore la publication technique et PDF"
          git push origin HEAD:qa/livre-iv-pdf-closure
