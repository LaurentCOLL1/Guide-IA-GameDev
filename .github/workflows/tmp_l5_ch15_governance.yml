name: Temporary Livre V Chapter 15 Governance

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/tmp_l5_ch15_governance_trigger.txt"

permissions:
  contents: write

concurrency:
  group: livre-v-ch15-governance
  cancel-in-progress: false

jobs:
  finalize-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-v-ch15-bases-vectorielles-recherche-semantique
          fetch-depth: 0

      - name: Execute deterministic synthetic vector fixtures
        run: |
          mkdir -p dist
          set -o pipefail
          python3 tools/tmp_l5_ch15_validate_vectors_run.py \
            | tee dist/QA-LIVRE-V-CH15-VECTORS.log

      - name: Apply permanent governance
        run: |
          set -o pipefail
          python3 tools/tmp_l5_ch15_governance.py \
            | tee dist/QA-LIVRE-V-CH15-GOVERNANCE.log

      - name: Validate structure, metadata, links and duplicates
        run: |
          set -o pipefail
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md \
            | tee dist/QA-CHAPTERS.log

      - name: Validate Livre V cards and deep links
        run: |
          set -o pipefail
          python3 tools/validate_livre_v_references.py --check \
            | tee dist/QA-LIVRE-V-REFERENCES.log

      - name: Validate structured code explanations
        run: |
          set -o pipefail
          python3 tools/check_code_explanation_structure.py --check \
            | tee dist/QA-EXPLICATIONS-CODE.log

      - name: Audit usage marker presence
        run: |
          set -o pipefail
          python3 tools/check_context_markers.py --check \
            | tee dist/QA-CONTEXTES.log

      - name: Audit semantic marker consistency
        run: |
          set -o pipefail
          python3 tools/audit_contextes_semantiques.py --check \
            | tee dist/QA-CONTEXTES-SEMANTIQUES.log

      - name: Measure context coverage
        run: |
          set -o pipefail
          python3 tools/report_contextes_utilisation.py \
            | tee dist/QA-CONTEXTES-COUVERTURE.md

      - name: Assert that no PDF was produced
        run: |
          if find . -type f -name '*.pdf' -print -quit | grep -q .; then
            echo "Un PDF a été produit pendant une validation légère." >&2
            exit 1
          fi

      - name: Commit permanent governance lot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CONTINUITE-PROJET.md \
            ROADMAP.md \
            contents.txt \
            plans/LIVRE-V-PLAN-MAITRE.md \
            Livre-V/index.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Gouvernance permanente déjà enregistrée."
          else
            git commit -m "docs(livre-v): finaliser la gouvernance de la fiche vectorielle"
            git push origin HEAD:docs/livre-v-ch15-bases-vectorielles-recherche-semantique
          fi

      - name: Upload lightweight QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livre-v-ch15-governance
          if-no-files-found: warn
          retention-days: 30
          path: |
            dist/QA-LIVRE-V-CH15-VECTORS.json
            dist/QA-LIVRE-V-CH15-VECTORS.log
            dist/QA-LIVRE-V-CH15-GOVERNANCE.log
            dist/QA-CHAPTERS.md
            dist/QA-CHAPTERS.log
            dist/QA-LIVRE-V-REFERENCES.log
            dist/QA-EXPLICATIONS-CODE.log
            dist/QA-CONTEXTES.log
            dist/QA-CONTEXTES-SEMANTIQUES.log
            dist/QA-CONTEXTES-COUVERTURE.md
