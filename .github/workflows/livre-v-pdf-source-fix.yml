name: Livre V PDF Source Fix

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  normalize-chapter-separators:
    if: >-
      github.event.pull_request.number == 381 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'qa/livre-v-pdf-closure'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize separators before Livre V markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Livre-V/CHAPITRE-05-Fiches-des-modeles-de-langage.md')
          text = path.read_text(encoding='utf-8')
          old_card = '\n---\n<!-- l5:card -->\n'
          old_matrix = '\n---\n<!-- l5:matrix -->\n'
          count_card = text.count(old_card)
          count_matrix = text.count(old_matrix)
          updated = text.replace(old_card, '\n---\n\n<!-- l5:card -->\n')
          updated = updated.replace(old_matrix, '\n---\n\n<!-- l5:matrix -->\n')
          if updated == text:
              print('All Livre V separators are already normalized.')
          else:
              path.write_text(updated, encoding='utf-8', newline='\n')
              print(f'Normalized card separators: {count_card}; matrix separators: {count_matrix}.')
          PY

      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No correction to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Livre-V/CHAPITRE-05-Fiches-des-modeles-de-langage.md
          git commit -m 'fix(livre-v): normaliser les séparateurs de la fiche 05 pour Pandoc'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
