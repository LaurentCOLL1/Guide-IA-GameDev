name: Livre IV Chapter 18 Finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - tools/temporary/ch18.start
      - tools/temporary/ch18.*.b64
      - .github/workflows/livre-iv-ch18-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/livre-iv-chapitre-18-accessibilite'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-18-accessibilite
          fetch-depth: 0

      - name: Reconstruct finalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          root = Path('tools/temporary')
          encoded = ''.join(
              path.read_text(encoding='utf-8').strip()
              for path in sorted(root.glob('ch18.finalizer.*.b64'))
          )
          encoded += '=' * (-len(encoded) % 4)
          source = gzip.decompress(base64.b64decode(encoded))
          (root / 'finalize_l4_ch18.py').write_bytes(source)
          PY

      - name: Finalize chapter lot
        id: finalize
        shell: bash
        run: |
          set +e
          python tools/temporary/finalize_l4_ch18.py > tools/temporary/ch18-finalizer.log 2>&1
          code=$?
          cat tools/temporary/ch18-finalizer.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload finalizer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-18-finalizer-log
          path: tools/temporary/ch18-finalizer.log

      - name: Assert finalizer success
        if: steps.finalize.outputs.exit_code != '0'
        run: exit 1

      - name: Commit permanent chapter lot
        if: steps.finalize.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm tools/temporary/ch18-finalizer.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          expected='CONTINUITE-PROJET.md Livre-IV/CHAPITRE-18-Accessibilite.md Livre-IV/QA/AUDIT-CHAPITRE-18.md Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-18.yaml Livre-IV/index.md ROADMAP.md contents.txt plans/LIVRE-IV-PLAN-MAITRE.md '
          actual="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          test "$actual" = "$expected"
          git commit -m "docs(livre-iv): finaliser le chapitre 18 sur l’accessibilité"
          git push origin HEAD:docs/livre-iv-chapitre-18-accessibilite
