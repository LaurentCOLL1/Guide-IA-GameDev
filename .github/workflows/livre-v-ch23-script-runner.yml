name: Temporary Livre V Chapter 23 Script Runner

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 366 && github.event.pull_request.head.ref == 'docs/livre-v-ch23-comparatifs-solutions'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout documentary branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validator dependency
        run: python3 -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Correct audit metadata and deep links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          audit = Path('Livre-V/QA/AUDIT-CHAPITRE-23.md')
          audit_text = audit.read_text(encoding='utf-8')
          audit_text = audit_text.replace(
              'chapter: 23\naudit-date: "2026-07-29T22:44:00+02:00"',
              'chapter: 23\nlast-verified: "2026-07-29T22:44:00+02:00"\naudit-date: "2026-07-29T22:44:00+02:00"',
              1,
          )
          audit.write_text(audit_text, encoding='utf-8', newline='\n')

          chapter = Path('Livre-V/CHAPITRE-23-Comparatifs-des-solutions.md')
          chapter_text = chapter.read_text(encoding='utf-8')
          replacements = {
              '../Livre-IV/CHAPITRE-03-Tests-fonctionnels-et-tests-de-regression.md)': '../Livre-IV/CHAPITRE-03-Tests-fonctionnels-et-tests-de-regression.md#6-contrat-dun-cas)',
              '../Livre-IV/CHAPITRE-05-Journalisation-et-observabilite-locale.md)': '../Livre-IV/CHAPITRE-05-Journalisation-et-observabilite-locale.md#8-distinguer-événements-métriques-et-traces)',
              '../Livre-IV/CHAPITRE-06-Profilage-CPU.md)': '../Livre-IV/CHAPITRE-06-Profilage-CPU.md#8-mesurer-plusieurs-distributions-pas-un-seul-nombre)',
              '../Livre-IV/CHAPITRE-07-Profilage-GPU-et-optimisation-du-rendu.md)': '../Livre-IV/CHAPITRE-07-Profilage-GPU-et-optimisation-du-rendu.md#7-distinguer-cpu-de-rendu-gpu-et-attente)',
              '../Livre-IV/CHAPITRE-08-Optimisation-RAM-VRAM-et-allocations.md)': '../Livre-IV/CHAPITRE-08-Optimisation-RAM-VRAM-et-allocations.md#7-les-quatre-questions-dune-enquête-mémoire)',
              '../Livre-IV/CHAPITRE-09-Chargements-streaming-et-gestion-des-ressources.md)': '../Livre-IV/CHAPITRE-09-Chargements-streaming-et-gestion-des-ressources.md#8-budgets-de-chargement)',
              '../Livre-IV/CHAPITRE-10-Optimisation-des-scenes-scripts-et-systemes-de-jeu.md)': '../Livre-IV/CHAPITRE-10-Optimisation-des-scenes-scripts-et-systemes-de-jeu.md#7-classer-le-coût-avant-de-modifier)',
              '../Livre-IV/CHAPITRE-14-DevOps-et-integration-continue.md)': '../Livre-IV/CHAPITRE-14-DevOps-et-integration-continue.md#1-rôle-du-chapitre)',
              '../Livre-IV/CHAPITRE-16-Exports-Godot-et-packaging.md)': '../Livre-IV/CHAPITRE-16-Exports-Godot-et-packaging.md#4-prérequis-et-frontières)',
              '../Livre-III/CHAPITRE-29-Validation-technique-et-artistique-des-assets.md)': '../Livre-III/CHAPITRE-29-Validation-technique-et-artistique-des-assets.md#1-rôle-du-chapitre)',
              '../Livre-II/CHAPITRE-09-Sauvegardes-chargements-et-compatibilite-des-versions.md)': '../Livre-II/CHAPITRE-09-Sauvegardes-chargements-et-compatibilite-des-versions.md#3-périmètre-et-frontières)',
          }
          for old, new in replacements.items():
              chapter_text = chapter_text.replace(old, new)
          chapter.write_text(chapter_text, encoding='utf-8', newline='\n')
          PY

      - name: Finalize governance and evidence
        env:
          SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/finalize_livre_v_ch23.py

      - name: Validate chapters without PDF
        run: |
          mkdir -p dist
          set -o pipefail
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md | tee dist/QA-CHAPTERS.log

      - name: Validate Livre V cards and deep links
        run: |
          set -o pipefail
          python3 tools/validate_livre_v_references.py --check | tee dist/QA-LIVRE-V-REFERENCES.log

      - name: Validate structured code explanations
        run: |
          set -o pipefail
          python3 tools/check_code_explanation_structure.py --check | tee dist/QA-EXPLICATIONS-CODE.log

      - name: Validate usage contexts
        run: |
          set -o pipefail
          python3 tools/check_context_markers.py --check | tee dist/QA-CONTEXTES.log

      - name: Validate semantic usage contexts
        run: |
          set -o pipefail
          python3 tools/audit_contextes_semantiques.py --check | tee dist/QA-CONTEXTES-SEMANTIQUES.log

      - name: Measure context coverage
        run: |
          set -o pipefail
          python3 tools/report_contextes_utilisation.py | tee dist/QA-CONTEXTES-COUVERTURE.md

      - name: Assert that no PDF was produced
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD -- '*.pdf' | grep -q .; then
            echo 'A PDF was added or modified.' >&2
            exit 1
          fi
          if find dist -type f -iname '*.pdf' -print -quit | grep -q .; then
            echo 'A PDF was produced in dist.' >&2
            exit 1
          fi

      - name: Remove temporary files and reports
        run: |
          rm -rf dist
          rm -f .github/scripts/finalize_livre_v_ch23.py
          rm -f .github/workflows/livre-v-ch23-finalizer-trigger.yml

      - name: Verify permanent lot
        run: |
          git fetch origin main
          mapfile -t actual < <(git diff --name-only origin/main | grep -v '^.github/workflows/livre-v-ch23-script-runner.yml$' | sort)
          mapfile -t expected < <(printf '%s\n' \
            CONTINUITE-PROJET.md \
            Livre-V/CHAPITRE-23-Comparatifs-des-solutions.md \
            Livre-V/QA/AUDIT-CHAPITRE-23.md \
            Livre-V/QA/VALIDATION-FINALE-CHAPITRE-23.yaml \
            Livre-V/index.md \
            ROADMAP.md \
            contents.txt \
            plans/LIVRE-V-PLAN-MAITRE.md | sort)
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Commit finalized permanent lot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(livre-v): finaliser la fiche 23'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
