name: Temporary Livre V Chapter 24 Script Runner

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 370 && github.event.pull_request.head.ref == 'docs/livre-v-ch24-checklists-production-publication'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout documentary branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validator dependency
        run: python3 -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Correct known references and metric assertion
        run: |
          sed -i 's/#compa-00--contrat-minimal-dun-comparatif/#cmp-00--contrat-minimal-dun-comparatif/g' Livre-V/CHAPITRE-24-Checklists-de-production-et-de-publication.md
          sed -i 's/#4-modèle-mental--une-mise-à-jour-est-une-transaction-distribuée/#4-modèle-mental-une-mise-à-jour-est-une-transaction-distribuée/g' Livre-V/CHAPITRE-24-Checklists-de-production-et-de-publication.md
          sed -i 's/#4-modèle-mental--conserver-un-système-pas-seulement-un-zip/#4-modèle-mental-conserver-un-système-pas-seulement-un-zip/g' Livre-V/CHAPITRE-24-Checklists-de-production-et-de-publication.md
          sed -i 's/metrics\["COMPACT_DIAGRAMS"\] != 8/metrics["COMPACT_DIAGRAMS"] != 9/' .github/scripts/finalize_livre_v_ch24.py
          sed -i 's/Expected 8 compact diagrams/Expected 9 compact diagrams/' .github/scripts/finalize_livre_v_ch24.py

      - name: Finalize governance and evidence
        env:
          SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          LIGHTWEIGHT_RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/finalize_livre_v_ch24.py

      - name: Validate chapters without PDF
        run: |
          mkdir -p dist
          set -o pipefail
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md | tee dist/QA-CHAPTERS.log

      - name: Validate Livre V cards and deep links
        run: |
          set -o pipefail
          python3 tools/validate_livre_v_references.py --check | tee dist/QA-LIVRE-V-REFERENCES.log

      - name: Validate structured code explanations
        run: |
          set -o pipefail
          python3 tools/check_code_explanation_structure.py --check | tee dist/QA-EXPLICATIONS-CODE.log

      - name: Validate usage contexts
        run: |
          set -o pipefail
          python3 tools/check_context_markers.py --check | tee dist/QA-CONTEXTES.log

      - name: Validate semantic usage contexts
        run: |
          set -o pipefail
          python3 tools/audit_contextes_semantiques.py --check | tee dist/QA-CONTEXTES-SEMANTIQUES.log

      - name: Measure context coverage
        run: |
          set -o pipefail
          python3 tools/report_contextes_utilisation.py | tee dist/QA-CONTEXTES-COUVERTURE.md

      - name: Assert that no PDF was produced
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD -- '*.pdf' | grep -q .; then
            echo 'A PDF was added or modified.' >&2
            exit 1
          fi
          if find dist -type f -iname '*.pdf' -print -quit | grep -q .; then
            echo 'A PDF was produced in dist.' >&2
            exit 1
          fi

      - name: Remove temporary files and reports
        run: |
          rm -rf dist
          rm -f .github/scripts/finalize_livre_v_ch24.py
          rm -f .github/workflows/livre-v-ch24-finalizer-trigger.yml

      - name: Verify permanent lot
        run: |
          git fetch origin main
          mapfile -t actual < <(git diff --name-only origin/main | grep -v '^.github/workflows/livre-v-ch24-script-runner.yml$' | sort)
          mapfile -t expected < <(printf '%s\n' \
            CONTINUITE-PROJET.md \
            Livre-V/CHAPITRE-24-Checklists-de-production-et-de-publication.md \
            Livre-V/QA/AUDIT-CHAPITRE-24.md \
            Livre-V/QA/VALIDATION-FINALE-CHAPITRE-24.yaml \
            Livre-V/index.md \
            ROADMAP.md \
            contents.txt \
            plans/LIVRE-V-PLAN-MAITRE.md | sort)
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Commit finalized permanent lot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(livre-v): finaliser la fiche 24'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
