name: Livre IV Chapter 10 Finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.qa/finalize-livre-iv-ch10.py'
      - '.qa/ch10-chapter.part*.b64'
      - '.qa/ch10-audit.md'
      - '.qa/ch10-proof.yaml'
      - '.github/workflows/livre-iv-ch10-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-10-optimisation-systemes
          fetch-depth: 1

      - name: Detect pending finalizer
        id: pending
        shell: bash
        run: |
          if test -f .qa/finalize-livre-iv-ch10.py; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lightweight dependencies
        if: steps.pending.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Materialize chapter lot
        if: steps.pending.outputs.run == 'true'
        run: python .qa/finalize-livre-iv-ch10.py

      - name: Apply semantic marker correction
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter_path = Path("Livre-IV/CHAPITRE-10-Optimisation-des-scenes-scripts-et-systemes-de-jeu.md")
          chapter = chapter_path.read_text(encoding="utf-8")
          old = '> **[PS] PowerShell 7 — Exécuter `python tools/performance/analyze_system_samples.py samples.jsonl`.**'
          new = '> **[VSC] Visual Studio Code — Créer `tools/performance/analyze_system_samples.py`.**'
          if chapter.count(old) != 1:
              raise SystemExit("Repère Python attendu exactement une fois")
          chapter_path.write_text(chapter.replace(old, new), encoding="utf-8", newline="\n")

          proof_path = Path("Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-10.yaml")
          proof = proof_path.read_text(encoding="utf-8")
          old_hash = "340d10d8b03495c43272c6242ce85d8c3fad9c28cd9f35c815e9c50d03f59528"
          new_hash = "406cc3c814354e92bc12825a35be9f9e65bf6e3030a96290a79f0bc2e36b1759"
          if proof.count(old_hash) != 1:
              raise SystemExit("Empreinte provisoire attendue exactement une fois")
          proof_path.write_text(proof.replace(old_hash, new_hash), encoding="utf-8", newline="\n")
          PY

      - name: Assert reader boundaries
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          chapter="Livre-IV/CHAPITRE-10-Optimisation-des-scenes-scripts-et-systemes-de-jeu.md"
          ! grep -qi 'GPT-5.6 Sol' "$chapter"
          ! grep -qi 'Prochaine action' "$chapter"
          ! grep -qi 'PDF' "$chapter"

      - name: Validate structure metadata links and duplicates
        if: steps.pending.outputs.run == 'true'
        run: python tools/validate_chapters.py

      - name: Validate structured explanations
        if: steps.pending.outputs.run == 'true'
        run: python tools/check_code_explanation_structure.py

      - name: Audit usage markers
        if: steps.pending.outputs.run == 'true'
        run: python tools/check_context_markers.py --check

      - name: Audit semantic marker consistency
        if: steps.pending.outputs.run == 'true'
        run: python tools/audit_contextes_semantiques.py --check

      - name: Measure chapter context coverage
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("Livre-IV/CHAPITRE-10-Optimisation-des-scenes-scripts-et-systemes-de-jeu.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          marker = re.compile(r"^> \*\*\[(PS|CMD|WSL|DCT|DCK|VSC|WEB|APP|SORTIE|LECTURE)\]")
          inside = False
          openings = 0
          errors = []
          for index, line in enumerate(lines):
              match = re.match(r"^```([^`]*)$", line.strip())
              if not match:
                  continue
              if not inside:
                  openings += 1
                  cursor = index - 1
                  while cursor >= 0 and not lines[cursor].strip():
                      cursor -= 1
                  if cursor < 0 or not marker.match(lines[cursor].strip()):
                      errors.append(index + 1)
                  inside = True
              else:
                  inside = False
          if inside:
              raise SystemExit("Bloc Markdown non fermé")
          if openings != 54:
              raise SystemExit(f"Nombre de blocs inattendu: {openings}")
          if errors:
              raise SystemExit(f"Blocs sans repère: {errors}")
          print({"chapter": path.as_posix(), "controlled_blocks": openings, "errors": 0})
          PY

      - name: Assert lightweight validation produced no PDF
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          if find . -type f -iname '*.pdf' -newer .qa/finalize-livre-iv-ch10.py -print -quit | grep -q .; then
            echo "Un PDF a été produit pendant la validation légère."
            exit 1
          fi

      - name: Upload QA evidence
        if: steps.pending.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: livre-iv-ch10-validation-without-pdf
          path: |
            Livre-IV/QA/AUDIT-CHAPITRE-10.md
            Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-10.yaml
          if-no-files-found: error

      - name: Commit finalized chapter lot
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          rm .qa/finalize-livre-iv-ch10.py
          rm .qa/ch10-chapter.part01.b64
          rm .qa/ch10-chapter.part02.b64
          rm .qa/ch10-chapter.part03.b64
          rm .qa/ch10-chapter.part04.b64
          rm .qa/ch10-audit.md
          rm .qa/ch10-proof.yaml
          rm .github/workflows/livre-iv-ch10-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(livre-iv): créer le chapitre 10 sur l’optimisation des systèmes"
          git push origin HEAD:docs/livre-iv-chapitre-10-optimisation-systemes
