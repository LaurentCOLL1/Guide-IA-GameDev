name: Livre IV Chapter 22 Diagnostic Rubrics Corrector

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - tools/temporary/ch22.diagnostic-rubrics-fix

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'docs/livre-iv-chapitre-22-maintenance-archivage-perennite'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-22-maintenance-archivage-perennite
          fetch-depth: 0

      - name: Complete diagnostic rubrics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          chapter_path = Path('Livre-IV/CHAPITRE-22-Maintenance-archivage-et-perennite.md')
          proof_path = Path('Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-22.yaml')
          continuity_path = Path('CONTINUITE-PROJET.md')
          chapter = chapter_path.read_text(encoding='utf-8')
          start = chapter.index('## 45. Dix diagnostics détaillés')
          end = chapter.index('## 46. Checklist', start)
          before, section, after = chapter[:start], chapter[start:end], chapter[end:]
          parts = re.split(r'(?=^### 45\.\d+ )', section, flags=re.MULTILINE)
          if len(parts) != 11:
              raise SystemExit(f'unexpected diagnostic count: {len(parts) - 1}')
          marker = '<!-- qa:code-explanation -->\n\n**Explication structurée du bloc :**'
          corrected = [parts[0]]
          for index, part in enumerate(parts[1:], start=1):
              if part.count(marker) != 2:
                  raise SystemExit(f'diagnostic {index} has {part.count(marker)} explanation blocks')
              part = part.replace(
                  marker,
                  '<!-- qa:code-explanation -->\n\n**Pourquoi cet exemple est fautif :**\n\n**Explication structurée du bloc :**',
                  1,
              )
              part = part.replace(
                  marker,
                  '<!-- qa:code-explanation -->\n\n**Pourquoi la correction fonctionne :**\n\n**Explication structurée du bloc :**',
                  1,
              )
              corrected.append(part)
          chapter = before + ''.join(corrected) + after
          if chapter.count('**Pourquoi cet exemple est fautif :**') != 10:
              raise SystemExit('faulty rubric count mismatch')
          if chapter.count('**Pourquoi la correction fonctionne :**') != 10:
              raise SystemExit('corrected rubric count mismatch')
          if len(chapter.splitlines()) != 1979:
              raise SystemExit(f'unexpected chapter line count: {len(chapter.splitlines())}')
          digest = hashlib.sha256(chapter.rstrip('\n').encode('utf-8')).hexdigest()
          if digest != '765857c5c98c810a82828efaead63ab6e65911ec5888300080c68a99038b4598':
              raise SystemExit(f'unexpected chapter digest: {digest}')
          chapter_path.write_text(chapter.rstrip() + '\n', encoding='utf-8')

          proof = proof_path.read_text(encoding='utf-8')
          proof = proof.replace('chapter-lines: 1939', 'chapter-lines: 1979')
          proof = proof.replace(
              'chapter-sha256: 74e08640ce14d05adcdec78cd2eaaf722047b69a1e5766be516cc4cc26a91c85',
              f'chapter-sha256: {digest}',
          )
          proof_path.write_text(proof.rstrip() + '\n', encoding='utf-8')

          continuity = continuity_path.read_text(encoding='utf-8')
          continuity = continuity.replace(
              'métriques statiques provisoires : 1939 lignes, 60 titres, 48 blocs de code ou de données, 28 explications hors diagnostics et dix diagnostics',
              'métriques statiques provisoires : 1979 lignes, 60 titres, 48 blocs de code ou de données, 28 explications hors diagnostics et dix diagnostics',
          )
          continuity_path.write_text(continuity.rstrip() + '\n', encoding='utf-8')

          Path('tools/temporary/ch22.diagnostic-rubrics-fix').unlink()
          Path('.github/workflows/livre-iv-chapter-22-diagnostic-rubrics-corrector.yml').unlink()
          PY
          git add -A
          permanent='CONTINUITE-PROJET.md Livre-IV/CHAPITRE-22-Maintenance-archivage-et-perennite.md Livre-IV/QA/AUDIT-CHAPITRE-22.md Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-22.yaml Livre-IV/index.md ROADMAP.md contents.txt plans/LIVRE-IV-PLAN-MAITRE.md '
          final_diff="$(git diff --cached --name-only 2cbe75d9c922c70a21c6e342383ab8331e20565c | sort | tr '\n' ' ')"
          test "$final_diff" = "$permanent"

      - name: Commit corrected permanent lot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(ch22): compléter les rubriques des diagnostics"
          git push origin HEAD:docs/livre-iv-chapitre-22-maintenance-archivage-perennite
