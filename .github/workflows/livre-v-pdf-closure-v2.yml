name: Livre V PDF Closure Runner V2

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: read

jobs:
  build-and-preflight:
    if: >-
      github.event.pull_request.number == 381 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'qa/livre-v-pdf-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install complete PDF toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-recommended \
            lmodern fonts-dejavu fonts-liberation librsvg2-bin poppler-utils qpdf
          python3 -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Validate documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md
          python3 tools/validate_livre_v_references.py --check | tee dist/QA-LIVRE-V-REFERENCES.log
          python3 tools/check_code_explanation_structure.py --check
          python3 tools/check_context_markers.py --check
          python3 tools/audit_contextes_semantiques.py --check
          python3 tools/report_contextes_utilisation.py > dist/QA-CONTEXTES-COUVERTURE.md

      - name: Build cumulative reader PDF
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh 2>&1 | tee dist/BUILD-LOG.txt

      - name: Preflight and map Livre V
        shell: bash
        run: |
          set -euo pipefail
          PDF=dist/Guide-IA-GameDev.pdf
          TEXT=dist/Guide-IA-GameDev.txt
          test -s "$PDF"
          qpdf --check "$PDF" | tee dist/QPDF-CHECK.txt
          pdfinfo "$PDF" | tee dist/PDF-INFO.txt
          pdffonts "$PDF" | tee dist/PDF-FONTS.txt
          pdftotext -layout "$PDF" "$TEXT"
          if grep -Eq "Audit post-création|VALIDATION-FINALE-CHAPITRE|VALIDATION-PUBLICATION-LIVRE|PROTOCOLE-FICHES-LIVRE-V|Protocole d.audit post-création" "$TEXT"; then
            echo "Internal QA content leaked into reader PDF." >&2
            exit 1
          fi
          if grep -Eq "Type 3|unknown" dist/PDF-FONTS.txt; then
            echo "Unexpected PDF font type detected." >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          raw = Path('dist/Guide-IA-GameDev.txt').read_text(encoding='utf-8', errors='replace')
          pages = raw.split('\f')
          if pages and not pages[-1].strip():
              pages.pop()

          def norm(value: str) -> str:
              return re.sub(r'\s+', ' ', value).strip()

          normalized_pages = [norm(page) for page in pages]
          sources = [Path('Livre-V/index.md')] + sorted(Path('Livre-V').glob('CHAPITRE-*.md'))
          chapters = sources[1:]
          if len(chapters) != 26:
              raise SystemExit(f'Expected 26 chapters, found {len(chapters)}')

          title_data = []
          for path in sources:
              source = path.read_text(encoding='utf-8')
              title = next((line[2:].strip() for line in source.splitlines() if line.startswith('# ')), None)
              if not title:
                  raise SystemExit(f'{path}: missing H1')
              matches = [index + 1 for index, page in enumerate(normalized_pages) if norm(title) in page]
              if not matches:
                  raise SystemExit(f'{path}: title absent from extracted PDF text: {title}')
              title_data.append((path, title, matches))

          # The table of contents contains the same titles before the real Livre V pages.
          # Select the final occurrence of the Livre V index, then move strictly forward
          # through the 26 chapter openings.
          entries = []
          previous_page = 0
          for position, (path, title, matches) in enumerate(title_data):
              if position == 0:
                  page = matches[-1]
              else:
                  page = next((candidate for candidate in matches if candidate > previous_page), None)
                  if page is None:
                      raise SystemExit(f'{path}: no title occurrence after page {previous_page}')
              entries.append({'path': str(path), 'title': title, 'page': page, 'matches': matches})
              previous_page = page

          companion = Path('Companion-Pack/index.md')
          companion_title = next((line[2:].strip() for line in companion.read_text(encoding='utf-8').splitlines() if line.startswith('# ')), '')
          companion_matches = [index + 1 for index, page in enumerate(normalized_pages) if companion_title and norm(companion_title) in page]
          companion_page = next((candidate for candidate in companion_matches if candidate > previous_page), None)
          companion_pages = [companion_page] if companion_page else []
          last_page = companion_page - 1 if companion_page else len(pages)

          starts = [entry['page'] for entry in entries]
          next_starts = starts[1:] + ([companion_page] if companion_page else [len(pages) + 1])
          sample_pages = set()
          for start, next_start in zip(starts, next_starts):
              sample_pages.add(start)
              if start + 1 < next_start:
                  sample_pages.add(start + 1)
              if next_start - start > 4:
                  sample_pages.add((start + next_start - 1) // 2)
          sample_pages.add(last_page)
          if companion_page:
              sample_pages.add(companion_page)

          anchors = starts + [last_page]
          parity_indexes = sorted(set([0, 1, len(anchors)//4, len(anchors)//2, (3*len(anchors))//4, len(anchors)-2, len(anchors)-1]))
          parity_pages = sorted(set(anchors[index] for index in parity_indexes if 0 <= index < len(anchors)))

          payload = {
              'total_pdf_pages': len(pages),
              'livre_v_entries': entries,
              'companion_pack_title': companion_title,
              'companion_pack_matches': companion_matches,
              'companion_pack_pages': companion_pages,
              'livre_v_last_page': last_page,
              'sample_pages': sorted(sample_pages),
              'parity_pages': parity_pages,
          }
          Path('dist/LIVRE-V-PAGE-MAP.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('dist/SAMPLE-PAGES.txt').write_text(','.join(map(str, sorted(sample_pages))) + '\n', encoding='utf-8')
          Path('dist/PARITY-PAGES.txt').write_text(','.join(map(str, parity_pages)) + '\n', encoding='utf-8')
          print(
              f'Livre V index and 26 chapter openings mapped from page {entries[0]["page"]} '
              f'to page {last_page}; {len(sample_pages)} sample pages selected.'
          )
          PY
          sha256sum "$PDF" | tee dist/Guide-IA-GameDev.pdf.sha256
          sha256sum "$TEXT" | tee dist/Guide-IA-GameDev.txt.sha256
          stat --printf='size_bytes=%s\n' "$PDF" | tee dist/PDF-METRICS.txt
          pdfinfo "$PDF" | awk -F: '/^Pages|^Page size|^Encrypted|^Tagged|^PDF version/ {gsub(/^[ \t]+/, "", $2); print $1 "=" $2}' | tee -a dist/PDF-METRICS.txt

      - name: Upload PDF closure candidate
        uses: actions/upload-artifact@v4
        with:
          name: livre-v-reader-pdf-candidate-v2
          path: |
            dist/Guide-IA-GameDev.pdf
            dist/Guide-IA-GameDev.pdf.sha256
            dist/Guide-IA-GameDev.txt
            dist/Guide-IA-GameDev.txt.sha256
            dist/PDF-INFO.txt
            dist/PDF-FONTS.txt
            dist/PDF-METRICS.txt
            dist/QPDF-CHECK.txt
            dist/BUILD-LOG.txt
            dist/QA-CHAPTERS.md
            dist/QA-LIVRE-V-REFERENCES.log
            dist/QA-CONTEXTES-COUVERTURE.md
            dist/LIVRE-V-PAGE-MAP.json
            dist/SAMPLE-PAGES.txt
            dist/PARITY-PAGES.txt
          if-no-files-found: error
          retention-days: 30
