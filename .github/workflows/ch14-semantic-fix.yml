name: Chapter 14 Semantic Fix

on:
  push:
    branches:
      - docs/livre-iv-chapitre-14-devops-ci

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-14-devops-ci
          fetch-depth: 0

      - name: Correct four usage markers
        shell: python
        run: |
          from pathlib import Path

          path = Path('Livre-IV/CHAPITRE-14-DevOps-et-integration-continue.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '> **[WEB] Inspecter un run depuis l’interface GitHub — Adapter les chemins et valeurs au projet.**':
              '> **[APP] GitHub — Inspecter un run depuis l’interface GitHub — Adapter les chemins et valeurs au projet.**',
              '> **[DCT] Lire les versions depuis un conteneur isolé — Adapter les chemins et valeurs au projet.**':
              '> **[WSL] Terminal Linux ou WSL — Lire les versions depuis un conteneur isolé — Adapter les chemins et valeurs au projet.**',
              '> **[LECTURE] Exemple fautif — Ne pas appliquer.**\n\n```bash\ngit tag -f v1.0.0 NEW_COMMIT':
              '> **[WSL] Exemple fautif — Ne pas appliquer dans un terminal Linux ou WSL.**\n\n```bash\ngit tag -f v1.0.0 NEW_COMMIT',
              '> **[LECTURE] Exemple corrigé — Adapter au contrat du projet.**\n\n```bash\ngit tag -a v1.0.1 NEW_COMMIT':
              '> **[WSL] Exemple corrigé — Adapter au contrat du projet dans un terminal Linux ou WSL.**\n\n```bash\ngit tag -a v1.0.1 NEW_COMMIT',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Remplacement attendu une fois, trouvé {count}: {old[:80]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ch14-semantic-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Livre-IV/CHAPITRE-14-DevOps-et-integration-continue.md .github/workflows/ch14-semantic-fix.yml
          git commit -m "docs(ch14): corriger les repères sémantiques"
          git push origin HEAD:docs/livre-iv-chapitre-14-devops-ci
