name: Temporary Livre V Chapter 20 Script Runner

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 354 && github.event.pull_request.head.ref == 'docs/livre-v-ch20-catalogue-erreurs-diagnostics'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout documentary branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validator dependency
        run: python3 -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Finalize governance and evidence
        env:
          SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/finalize_livre_v_ch20.py

      - name: Validate chapters without PDF
        run: |
          mkdir -p dist
          set -o pipefail
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md | tee dist/QA-CHAPTERS.log

      - name: Validate Livre V cards and deep links
        run: |
          set -o pipefail
          python3 tools/validate_livre_v_references.py --check | tee dist/QA-LIVRE-V-REFERENCES.log

      - name: Validate structured code explanations
        run: |
          set -o pipefail
          python3 tools/check_code_explanation_structure.py --check | tee dist/QA-EXPLICATIONS-CODE.log

      - name: Validate usage contexts
        run: |
          set -o pipefail
          python3 tools/check_context_markers.py --check | tee dist/QA-CONTEXTES.log

      - name: Validate semantic usage contexts
        run: |
          set -o pipefail
          python3 tools/audit_contextes_semantiques.py --check | tee dist/QA-CONTEXTES-SEMANTIQUES.log

      - name: Measure context coverage
        run: |
          set -o pipefail
          python3 tools/report_contextes_utilisation.py | tee dist/QA-CONTEXTES-COUVERTURE.md

      - name: Assert that no PDF was produced
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD -- '*.pdf' | grep -q .; then
            echo 'A PDF was added or modified.' >&2
            exit 1
          fi
          if find dist -type f -iname '*.pdf' -print -quit | grep -q .; then
            echo 'A PDF was produced in dist.' >&2
            exit 1
          fi

      - name: Remove temporary files and reports
        run: |
          rm -rf dist
          rm -f .github/scripts/finalize_livre_v_ch20.py
          rm -f .github/workflows/livre-v-ch20-finalizer-trigger.yml

      - name: Verify permanent lot
        run: |
          git fetch origin main
          mapfile -t actual < <(git diff --name-only origin/main | sort)
          mapfile -t expected < <(printf '%s\n' \
            CONTINUITE-PROJET.md \
            Livre-V/CHAPITRE-20-Catalogue-des-erreurs-et-diagnostics.md \
            Livre-V/QA/AUDIT-CHAPITRE-20.md \
            Livre-V/QA/VALIDATION-FINALE-CHAPITRE-20.yaml \
            Livre-V/index.md \
            ROADMAP.md \
            contents.txt \
            plans/LIVRE-V-PLAN-MAITRE.md | sort)
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Commit finalized permanent lot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CONTINUITE-PROJET.md Livre-V ROADMAP.md contents.txt plans/LIVRE-V-PLAN-MAITRE.md .github/scripts .github/workflows
          git commit -m 'docs(livre-v): finaliser la fiche 20'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
