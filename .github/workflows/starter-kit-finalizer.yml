name: Temporary Starter Kit Finalizer

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 392 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/companion-pack-starter-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Starter Kit branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load finalizer from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/scripts/finalize_starter_kit.py > "$RUNNER_TEMP/finalize_starter_kit.py"

      - name: Finalize Pack 1 and governance
        run: python3 "$RUNNER_TEMP/finalize_starter_kit.py"

      - name: Validate documentation and Starter Kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md
          python3 tools/validate_livre_v_references.py --check
          python3 tools/check_code_explanation_structure.py --check
          python3 tools/check_context_markers.py --check
          python3 tools/audit_contextes_semantiques.py --check
          python3 tools/report_contextes_utilisation.py > dist/QA-CONTEXTES-COUVERTURE.md
          python3 Companion-Pack/Starter-Kit/godot-project/tools/validate_project.py

      - name: Commit finalized Pack 1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          if git diff --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(companion-pack): finaliser le Starter Kit validé'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
