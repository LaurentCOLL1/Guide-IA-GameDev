name: Livre IV Chapter 14 Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - '.tmp/ch14/**'
      - '.github/workflows/ch14-finalizer.yml'

permissions:
  contents: write

concurrency:
  group: ch14-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/livre-iv-chapitre-14-devops-ci
          fetch-depth: 1
          show-progress: false

      - name: Restore and verify finalizer
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/ch14/finalizer01.txt \
            .tmp/ch14/finalizer02.txt \
            .tmp/ch14/finalizer03.txt \
            .tmp/ch14/finalizer04a.txt \
            .tmp/ch14/finalizer04b.txt \
            .tmp/ch14/finalizer04c.txt \
            .tmp/ch14/finalizer04d.txt \
            .tmp/ch14/finalizer05a.txt \
            .tmp/ch14/finalizer05b.txt \
            .tmp/ch14/finalizer05c.txt \
            .tmp/ch14/finalizer05d.txt \
            .tmp/ch14/finalizer06.txt \
            .tmp/ch14/finalizer07.txt \
            .tmp/ch14/finalizer08.txt \
            > /tmp/finalize_ch14.py.gz.b64
          base64 --decode /tmp/finalize_ch14.py.gz.b64 > /tmp/finalize_ch14.py.gz
          echo 'f378146fc163457c2ee960ed1b239707f7733ff8ed654c3e0cb6ebaaa27a1601  /tmp/finalize_ch14.py.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/finalize_ch14.py.gz > /tmp/finalize_ch14.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/finalize_ch14.py')
          text = path.read_text(encoding='utf-8')

          old_payload = '''payload = "".join(
              path.read_text(encoding="ascii")
              for path in sorted((ROOT / ".tmp/ch14").glob("payload*.txt"))
          )'''
          new_payload = '''payload_paths = [
              ROOT / f".tmp/ch14/payload0{index}.txt"
              for index in range(1, 6)
          ] + [
              ROOT / f".tmp/ch14/chapter06{suffix}.txt"
              for suffix in "abcdefgh"
          ]
          payload = "".join(path.read_text(encoding="ascii") for path in payload_paths)'''
          if text.count(old_payload) != 1:
              raise SystemExit('bloc de reconstruction du chapitre introuvable')
          text = text.replace(old_payload, new_payload)

          needle = '    ".tmp/ch14/finalizer08.txt",\n}'
          additions = ''.join(
              f'    ".tmp/ch14/finalizer{group}{suffix}.txt",\n'
              for group in ('04', '05')
              for suffix in ('a', 'b', 'c', 'd')
          )
          additions += ''.join(
              f'    ".tmp/ch14/chapter06{suffix}.txt",\n'
              for suffix in 'abcdefgh'
          )
          additions += '    ".tmp/ch14/last-error.txt",\n'
          if text.count(needle) != 1:
              raise SystemExit('point de patch du lot finaliseur introuvable')
          text = text.replace(
              needle,
              '    ".tmp/ch14/finalizer08.txt",\n' + additions + '}',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile /tmp/finalize_ch14.py

      - name: Install lightweight dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Finalize, validate and commit permanent lot
        shell: bash
        env:
          FINALIZER_BRANCH: docs/livre-iv-chapitre-14-devops-ci
        run: |
          set +e
          python /tmp/finalize_ch14.py > /tmp/ch14-finalizer.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            mkdir -p .tmp/ch14
            tail -n 120 /tmp/ch14-finalizer.log > .tmp/ch14/last-error.txt
            git reset --mixed
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .tmp/ch14/last-error.txt
            git commit -m "chore(ch14): enregistrer le diagnostic du finaliseur"
            git push origin HEAD:docs/livre-iv-chapitre-14-devops-ci
          fi
          tail -n 160 /tmp/ch14-finalizer.log
          exit "$status"
