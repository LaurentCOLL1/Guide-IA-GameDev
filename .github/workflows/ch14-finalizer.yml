name: Livre IV Chapter 14 Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - '.tmp/ch14/**'
      - '.github/workflows/ch14-finalizer.yml'

permissions:
  contents: write

concurrency:
  group: ch14-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/livre-iv-chapitre-14-devops-ci
          fetch-depth: 0

      - name: Restore and verify finalizer
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/ch14/finalizer01.txt \
            .tmp/ch14/finalizer02.txt \
            .tmp/ch14/finalizer03.txt \
            .tmp/ch14/finalizer04a.txt \
            .tmp/ch14/finalizer04b.txt \
            .tmp/ch14/finalizer04c.txt \
            .tmp/ch14/finalizer04d.txt \
            .tmp/ch14/finalizer05a.txt \
            .tmp/ch14/finalizer05b.txt \
            .tmp/ch14/finalizer05c.txt \
            .tmp/ch14/finalizer05d.txt \
            .tmp/ch14/finalizer06.txt \
            .tmp/ch14/finalizer07.txt \
            .tmp/ch14/finalizer08.txt \
            > /tmp/finalize_ch14.py.gz.b64
          base64 --decode /tmp/finalize_ch14.py.gz.b64 > /tmp/finalize_ch14.py.gz
          echo 'f378146fc163457c2ee960ed1b239707f7733ff8ed654c3e0cb6ebaaa27a1601  /tmp/finalize_ch14.py.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/finalize_ch14.py.gz > /tmp/finalize_ch14.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/finalize_ch14.py')
          text = path.read_text(encoding='utf-8')
          needle = '    ".tmp/ch14/finalizer08.txt",\n}'
          additions = ''.join(
              f'    ".tmp/ch14/finalizer{group}{suffix}.txt",\n'
              for group in ('04', '05')
              for suffix in ('a', 'b', 'c', 'd')
          )
          if text.count(needle) != 1:
              raise SystemExit('point de patch du lot finaliseur introuvable')
          path.write_text(text.replace(needle, '    ".tmp/ch14/finalizer08.txt",\n' + additions + '}'), encoding='utf-8')
          PY
          python -m py_compile /tmp/finalize_ch14.py

      - name: Install lightweight dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Finalize, validate and commit permanent lot
        shell: bash
        env:
          FINALIZER_BRANCH: docs/livre-iv-chapitre-14-devops-ci
        run: python /tmp/finalize_ch14.py
