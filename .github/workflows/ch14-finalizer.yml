name: Livre IV Chapter 14 Finalizer

on:
  push:
    branches:
      - docs/livre-iv-chapitre-14-devops-ci

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore and verify finalizer
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .tmp/ch14/finalizer.py.gz.b64 > /tmp/finalize_ch14.py.gz
          echo '5227a349a77332cf4278c5252fe4c530c3db9496ef00110ebc09b4de76e5f623  /tmp/finalize_ch14.py.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/finalize_ch14.py.gz > /tmp/finalize_ch14.py
          python -m py_compile /tmp/finalize_ch14.py

      - name: Install lightweight dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Finalize, validate and commit permanent lot
        shell: bash
        run: python /tmp/finalize_ch14.py
