name: Livre IV Chapter 17 Marker Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - tools/temporary/ch17-marker-fix.start
      - .github/workflows/livre-iv-ch17-marker-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'docs/livre-iv-chapitre-17-publication-distribution'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-17-publication-distribution
          fetch-depth: 0

      - name: Correct semantic markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          chapter_path = Path('Livre-IV/CHAPITRE-17-Publication-et-distribution.md')
          proof_path = Path('Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-17.yaml')
          text = chapter_path.read_text(encoding='utf-8')
          lines = text.splitlines()

          allowed = {
              'powershell': {'PS'},
              'bat': {'CMD'},
              'bash': {'WSL'},
              'markdown': {'LECTURE', 'SORTIE', 'VSC'},
              'yaml': {'LECTURE', 'SORTIE', 'VSC'},
              'json': {'LECTURE', 'SORTIE', 'VSC'},
              'text': {'APP', 'DCK', 'LECTURE', 'SORTIE', 'VSC'},
          }
          preferred = {
              'powershell': 'PS',
              'bat': 'CMD',
              'bash': 'WSL',
              'markdown': 'LECTURE',
              'yaml': 'LECTURE',
              'json': 'LECTURE',
              'text': 'LECTURE',
          }
          marker_re = re.compile(r'^(> \*\*\[)(PS|CMD|WSL|DCT|DCK|VSC|WEB|APP|SORTIE|LECTURE)(\].*)$')
          changed = []

          for i, line in enumerate(lines):
              match = marker_re.match(line)
              if not match:
                  continue
              language = None
              for j in range(i + 1, min(i + 8, len(lines))):
                  fence = re.match(r'^```([^\s`]*)', lines[j])
                  if fence:
                      language = fence.group(1).casefold()
                      break
              if language not in allowed:
                  continue
              current = match.group(2)
              if current not in allowed[language]:
                  replacement = preferred[language]
                  lines[i] = match.group(1) + replacement + match.group(3)
                  changed.append((i + 1, current, replacement, language))

          if len(changed) != 39:
              raise SystemExit(f'39 corrections attendues, {len(changed)} obtenues: {changed}')

          corrected = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          chapter_path.write_text(corrected, encoding='utf-8', newline='\n')
          digest = hashlib.sha256(corrected.encode('utf-8')).hexdigest()

          proof = proof_path.read_text(encoding='utf-8')
          proof, count = re.subn(
              r'(?m)^  chapter-sha256: [0-9a-f]{64}$',
              f'  chapter-sha256: {digest}',
              proof,
          )
          if count != 1:
              raise SystemExit('empreinte chapitre introuvable dans la preuve')
          proof_path.write_text(proof, encoding='utf-8', newline='\n')

          print(f'corrected_markers={len(changed)}')
          print(f'chapter_sha256={digest}')
          for item in changed:
              print(item)
          PY

      - name: Run semantic validation
        id: semantic
        shell: bash
        run: |
          set +e
          python tools/check_context_marker_semantics.py > tools/temporary/ch17-semantic-after-fix.log 2>&1
          code=$?
          cat tools/temporary/ch17-semantic-after-fix.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload semantic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-17-semantic-after-fix
          path: tools/temporary/ch17-semantic-after-fix.log

      - name: Assert semantic validation
        if: steps.semantic.outputs.exit_code != '0'
        run: exit 1

      - name: Remove temporary corrector
        if: steps.semantic.outputs.exit_code == '0'
        shell: bash
        run: |
          rm .github/workflows/livre-iv-ch17-marker-fix.yml
          rm tools/temporary/ch17-marker-fix.start
          rm tools/temporary/ch17-semantic-after-fix.log

      - name: Commit correction
        if: steps.semantic.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          expected='.github/workflows/livre-iv-ch17-marker-fix.yml Livre-IV/CHAPITRE-17-Publication-et-distribution.md Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-17.yaml tools/temporary/ch17-marker-fix.start '
          actual="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          test "$actual" = "$expected"
          git commit -m "docs(ch17): corriger les repères sémantiques"
          git push origin HEAD:docs/livre-iv-chapitre-17-publication-distribution
