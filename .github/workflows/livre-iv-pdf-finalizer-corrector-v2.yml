name: Livre IV PDF Finalizer Corrector V2

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .qa/livre-iv-pdf-finalizer-correct-v2.trigger

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'qa/livre-iv-pdf-closure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/livre-iv-pdf-closure
          fetch-depth: 0
      - name: Patch finalizer line by line
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/livre-iv-pdf-finalizer.yml')
          text = path.read_text(encoding='utf-8')

          substitutions = [
              (
                  '              Path(".github/workflows/livre-iv-pdf-finalizer.yml"),\n',
                  '              Path(".github/workflows/livre-iv-pdf-finalizer.yml"),\n'
                  '              Path(".github/workflows/livre-iv-pdf-finalizer-diagnostic.yml"),\n',
                  'diagnostic workflow cleanup',
              ),
              (
                  '              Path(".qa/livre-iv-pdf-finalize.trigger"),\n',
                  '              Path(".qa/livre-iv-pdf-finalize.trigger"),\n'
                  '              Path(".qa/livre-iv-pdf-finalize-diagnostic.trigger"),\n',
                  'diagnostic trigger cleanup',
              ),
              (
                  '          actual = set(subprocess.check_output(["git", "diff", "--name-only", "origin/main"]).decode().splitlines())\n',
                  '          tracked = set(subprocess.check_output(["git", "diff", "--name-only", "origin/main"]).decode().splitlines())\n'
                  '          untracked = set(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"]).decode().splitlines())\n'
                  '          actual = tracked | untracked\n',
                  'tracked and untracked diff',
              ),
          ]
          for old, new, label in substitutions:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one occurrence, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          for temporary in [
              Path('.github/workflows/livre-iv-pdf-finalizer-corrector.yml'),
              Path('.github/workflows/livre-iv-pdf-finalizer-corrector-v2.yml'),
              Path('.qa/livre-iv-pdf-finalizer-correct.trigger'),
              Path('.qa/livre-iv-pdf-finalizer-correct-v2.trigger'),
          ]:
              temporary.unlink(missing_ok=True)
          PY
      - name: Commit corrected finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(livre-iv): corriger l’assertion du lot de clôture"
          git push origin HEAD:qa/livre-iv-pdf-closure
