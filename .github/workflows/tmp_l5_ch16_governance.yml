name: Temporary Livre V Chapter 16 Governance

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/tmp_l5_ch16_finalize_trigger.txt"

permissions:
  contents: write

concurrency:
  group: livre-v-ch16-governance
  cancel-in-progress: false

jobs:
  finalize-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-v-ch16-patrons-architecture
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install lightweight dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Execute deterministic synthetic architecture fixtures
        run: |
          mkdir -p dist
          set -o pipefail
          python3 tools/tmp_l5_ch16_validate_architecture.py \
            | tee dist/QA-LIVRE-V-CH16-ARCHITECTURE.log

      - name: Measure chapter structure and integrity
        run: python3 tools/tmp_l5_ch16_measure.py

      - name: Apply permanent governance
        run: python3 tools/tmp_l5_ch16_finalize.py

      - name: Validate structure, metadata, links and duplicates
        run: |
          set -o pipefail
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md \
            | tee dist/QA-CHAPTERS.log

      - name: Validate Livre V cards and deep links
        run: |
          set -o pipefail
          python3 tools/validate_livre_v_references.py --check \
            | tee dist/QA-LIVRE-V-REFERENCES.log

      - name: Validate structured code explanations
        run: |
          set -o pipefail
          python3 tools/check_code_explanation_structure.py --check \
            | tee dist/QA-EXPLICATIONS-CODE.log

      - name: Audit usage marker presence
        run: |
          set -o pipefail
          python3 tools/check_context_markers.py --check \
            | tee dist/QA-CONTEXTES.log

      - name: Audit semantic marker consistency
        run: |
          set -o pipefail
          python3 tools/audit_contextes_semantiques.py --check \
            | tee dist/QA-CONTEXTES-SEMANTIQUES.log

      - name: Measure context coverage
        run: |
          set -o pipefail
          python3 tools/report_contextes_utilisation.py \
            | tee dist/QA-CONTEXTES-COUVERTURE.md

      - name: Assert that no PDF was produced
        run: |
          if find . -type f -name '*.pdf' -print -quit | grep -q .; then
            echo "Un PDF a été produit pendant une validation légère." >&2
            exit 1
          fi

      - name: Commit permanent governance lot
        run: |
          git add CONTINUITE-PROJET.md Livre-V/QA/VALIDATION-FINALE-CHAPITRE-16.yaml Livre-V/index.md ROADMAP.md contents.txt plans/LIVRE-V-PLAN-MAITRE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent governance changes to commit."
          else
            git commit -m "docs(livre-v): finaliser la gouvernance de la fiche 16"
            git push origin HEAD:docs/livre-v-ch16-patrons-architecture
          fi
          git rev-parse HEAD | tee dist/PERMANENT-COMMIT.txt

      - name: Upload lightweight QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livre-v-ch16-governance
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/QA-LIVRE-V-CH16-ARCHITECTURE.json
            dist/QA-LIVRE-V-CH16-ARCHITECTURE.log
            dist/QA-LIVRE-V-CH16-CHAPTER.json
            dist/QA-CHAPTERS.md
            dist/QA-CHAPTERS.log
            dist/QA-LIVRE-V-REFERENCES.log
            dist/QA-EXPLICATIONS-CODE.log
            dist/QA-CONTEXTES.log
            dist/QA-CONTEXTES-SEMANTIQUES.log
            dist/QA-CONTEXTES-COUVERTURE.md
            dist/PERMANENT-COMMIT.txt
