name: Temporary Livre V Chapter 17 Finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/livre-v-ch17-finalize.yml

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/livre-v-ch17-patrons-gameplay

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Finalize chapter governance and evidence
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import re
          from pathlib import Path

          ROOT = Path('.')
          RUN_ID = os.environ['RUN_ID']
          SOURCE_HEAD = os.environ['SOURCE_HEAD']

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: remplacement attendu une fois, trouvé {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          replace_once('Livre-V/index.md', 'version: "1.8.0"', 'version: "1.9.0"')
          replace_once(
              'Livre-V/index.md',
              '- [ ] Chapitre 17 — Patrons de gameplay.',
              '- [x] [Fiche 17 — Patrons de gameplay](CHAPITRE-17-Patrons-de-gameplay.md) — version `1.0.0`, niveau `static-review`.',
          )
          replace_once(
              'Livre-V/index.md',
              'Progression : **16 chapitres sur 26** rédigés et audités. Les fiches 01 à 16 utilisent le profil de référence spécialisé du Livre V ; la fiche 16 catalogue frontières, composition, injection, services d’application, repositories, ports, adaptateurs, événements, propriété d’état, façades, stratégies, coutures de test et anti-patterns. Les scènes, graphes et adaptateurs réellement exécutés, patrons de gameplay, fichiers du Companion Pack, licence globale et formats de publication avancés restent des chantiers distincts.',
              'Progression : **17 chapitres sur 26** rédigés et audités. Les fiches 01 à 17 utilisent le profil de référence spécialisé du Livre V ; la fiche 17 catalogue machines à états, variantes simples et avancées, capacités, commandes, inventaires, quêtes, simulations, matérialisation, commits multi-autorités, coutures de test et anti-patterns. Les petits prototypes Godot, scènes, scripts et fixtures permanentes du Companion Pack, la référence graphique et 3D, la licence globale et les formats de publication avancés restent des chantiers distincts.',
          )

          replace_once(
              'ROADMAP.md',
              '- [x] Patrons d’architecture — fiche 16 rédigée et auditée au niveau `static-review`.',
              '- [x] Patrons d’architecture — fiche 16 rédigée et auditée au niveau `static-review`.\n- [x] Patrons de gameplay — fiche 17 rédigée et auditée au niveau `static-review`.',
          )
          replace_once(
              'ROADMAP.md',
              '**Statut M6 : en cours — 16 chapitres rédigés, repérés et audités sur 26.**',
              '**Statut M6 : en cours — 17 chapitres rédigés, repérés et audités sur 26.**',
          )

          replace_once(
              'contents.txt',
              'Livre-V/CHAPITRE-16-Patrons-d-architecture.md\nCompanion-Pack/index.md',
              'Livre-V/CHAPITRE-16-Patrons-d-architecture.md\nLivre-V/CHAPITRE-17-Patrons-de-gameplay.md\nCompanion-Pack/index.md',
          )

          replace_once('plans/LIVRE-V-PLAN-MAITRE.md', 'version: "1.16.0"', 'version: "1.17.0"')
          replace_once(
              'plans/LIVRE-V-PLAN-MAITRE.md',
              '> **Statut :** 16 chapitres sur 26 rédigés et audités au niveau `static-review`',
              '> **Statut :** 17 chapitres sur 26 rédigés et audités au niveau `static-review`',
          )
          replace_once(
              'plans/LIVRE-V-PLAN-MAITRE.md',
              '## Chapitre 17 — Patrons de gameplay\n\n**Objectifs**',
              '## Chapitre 17 — Patrons de gameplay\n\n**État documentaire :** rédigé en version `1.0.0`, niveau `static-review`, au format fiches de référence.\n\n**Objectifs**',
          )

          replace_once('CONTINUITE-PROJET.md', 'version: "4.03.0"', 'version: "4.04.0"')
          replace_once(
              'CONTINUITE-PROJET.md',
              'last-updated: "2026-07-29T07:08:35+02:00"',
              'last-updated: "2026-07-29T10:21:00+02:00"',
          )
          replace_once(
              'CONTINUITE-PROJET.md',
              '- progression du Livre V : 16 chapitres sur 26 ;',
              '- progression du Livre V : 17 chapitres sur 26 ;',
          )
          replace_once(
              'CONTINUITE-PROJET.md',
              '- chapitre 16 du Livre V : version `1.0.0`, niveau `static-review`, format `reference-cards` ;',
              '- chapitre 16 du Livre V : version `1.0.0`, niveau `static-review`, format `reference-cards` ;\n- chapitre 17 du Livre V : version `1.0.0`, niveau `static-review`, format `reference-cards` ;',
          )

          continuity = read('CONTINUITE-PROJET.md')
          next_section = '''## 26. Prochaine action

Le Livre V contient dix-sept fiches sur 26 au niveau `static-review`. La fiche 17 fournit des contrats non linéaires pour machines à états, variantes simples et avancées, capacités, commandes, inventaires, quêtes, simulations déterministes, matérialisation, commits multi-autorités, extensibilité, coutures de test et anti-patterns. Les petits prototypes Godot, scènes, scripts et fixtures permanentes du Companion Pack, la référence graphique et 3D, les approbations juridiques, la licence globale et le balisage avancé restent ouverts.

Action suivante :

> **[LECTURE] Chemin et niveau prévisionnels — Ne pas saisir.**

```text
Livre-V/CHAPITRE-18-Reference-graphique-et-3D.md
Niveau GPT-5.6 Sol recommandé : Élevée
```

Le chapitre 18 rassemblera unités, axes, formats, PBR, UV, LOD, rigs, conventions, import, export et erreurs visuelles fréquentes. Il devra renvoyer aux méthodes propriétaires du Livre III sans les recopier ni prétendre qu’un budget ou un preset graphique convient à toutes les plateformes.
'''
          updated, count = re.subn(
              r'## 26\. Prochaine action\n.*?(?=## 27\. Journal)',
              next_section,
              continuity,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError(f'CONTINUITE-PROJET.md: section prochaine action remplacée {count} fois')
          continuity = updated

          journal_entry = f'''### 2026-07-29T10:21:00+02:00 — version 4.04.0

- création de la fiche 17 — Patrons de gameplay ;
- ajout de treize cartes, de trois matrices et de six diagrammes compacts ;
- machines à états, variantes simples et avancées, capacités, commandes, inventaires, quêtes, simulations, matérialisation, commits multi-autorités et coutures de test indexés ;
- frontières avec les systèmes propriétaires des chapitres 14, 17 à 20, 22, 25 et 27 du Livre II maintenues sans duplication ;
- validations documentaires légères sans PDF réussies dans le run `{RUN_ID}` ;
- métriques statiques : 442 lignes, 19 titres, 13 fiches, 3 matrices, 57 liens, 33 renvois vers les Livres I à IV, 4 liens profonds et 6 diagrammes compacts ;
- index, roadmap, ordre lecteur, plan maître, audit, preuve QA et continuité mis à jour ;
- prochaine action déplacée vers la fiche 18 — Référence graphique et 3D, niveau Élevée ;
- aucun runtime Godot, GDScript, scène, addon, base, réseau, service IA, prototype du Companion Pack, approbation juridique ou PDF produit.


'''
          marker = '## 27. Journal\n\n'
          if marker not in continuity:
              raise RuntimeError('CONTINUITE-PROJET.md: marqueur de journal absent')
          continuity = continuity.replace(marker, marker + journal_entry, 1)
          write('CONTINUITE-PROJET.md', continuity)

          chapter_path = ROOT / 'Livre-V/CHAPITRE-17-Patrons-de-gameplay.md'
          chapter_sha = hashlib.sha256(chapter_path.read_bytes()).hexdigest()
          audit_path = 'Livre-V/QA/AUDIT-CHAPITRE-17.md'
          audit = read(audit_path)
          for placeholder, value in {
              '__RUN_ID__': RUN_ID,
              '__HEAD_SHA__': SOURCE_HEAD,
              '__CHAPTER_SHA__': chapter_sha,
          }.items():
              if placeholder not in audit:
                  raise RuntimeError(f'{audit_path}: placeholder absent {placeholder}')
              audit = audit.replace(placeholder, value)
          write(audit_path, audit)
          audit_sha = hashlib.sha256((ROOT / audit_path).read_bytes()).hexdigest()

          proof_path = 'Livre-V/QA/VALIDATION-FINALE-CHAPITRE-17.yaml'
          proof = read(proof_path)
          for placeholder, value in {
              '__RUN_ID__': RUN_ID,
              '__HEAD_SHA__': SOURCE_HEAD,
              '__CHAPTER_SHA__': chapter_sha,
              '__AUDIT_SHA__': audit_sha,
          }.items():
              if placeholder not in proof:
                  raise RuntimeError(f'{proof_path}: placeholder absent {placeholder}')
              proof = proof.replace(placeholder, value)
          write(proof_path, proof)

          print(f'chapter_sha256={chapter_sha}')
          print(f'audit_sha256={audit_sha}')
          PY

      - name: Validate chapters without PDF
        run: python tools/validate_chapters.py --root . --report dist/QA-CHAPTERS.md

      - name: Validate Livre V cards and deep links
        run: python tools/validate_livre_v_references.py --check

      - name: Validate structured code explanations
        run: python tools/check_code_explanation_structure.py --check

      - name: Validate usage contexts
        run: python tools/check_context_markers.py --check

      - name: Validate semantic usage contexts
        run: python tools/audit_contextes_semantiques.py --check

      - name: Assert that no PDF was produced
        run: |
          if find . -type f -name '*.pdf' -print -quit | grep -q .; then
            echo "Un PDF a été produit pendant une validation légère." >&2
            exit 1
          fi

      - name: Remove temporary workflow and reports
        run: |
          rm -rf dist
          rm -f .github/workflows/livre-v-ch17-finalize.yml

      - name: Commit finalized permanent lot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "docs(livre-v): finaliser la fiche 17"
          git push origin HEAD:docs/livre-v-ch17-patrons-gameplay
