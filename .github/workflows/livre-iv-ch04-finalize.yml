name: Livre IV Chapter 4 Finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.qa/finalize-livre-iv-ch04.py'
      - '.github/workflows/livre-iv-ch04-finalize.yml'
      - '.qa/ch04-chapter.zlib.b64'
      - '.qa/ch04-audit.zlib.b64'
      - '.qa/ch04-proof.zlib.b64'

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-04-debogage
          fetch-depth: 1

      - name: Detect pending finalizer
        id: pending
        shell: bash
        run: |
          if test -f .qa/finalize-livre-iv-ch04.py; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lightweight dependencies
        if: steps.pending.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Materialize chapter lot
        if: steps.pending.outputs.run == 'true'
        run: python .qa/finalize-livre-iv-ch04.py

      - name: Assert reader boundaries
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          chapter="Livre-IV/CHAPITRE-04-Debogage-et-reproduction-des-anomalies.md"
          ! grep -qi 'GPT-5.6 Sol' "$chapter"
          ! grep -qi 'Prochaine action' "$chapter"
          ! grep -qi 'PDF' "$chapter"

      - name: Validate structure metadata links and duplicates
        if: steps.pending.outputs.run == 'true'
        run: python tools/validate_chapters.py

      - name: Validate structured explanations
        if: steps.pending.outputs.run == 'true'
        run: python tools/check_code_explanation_structure.py

      - name: Audit usage markers
        if: steps.pending.outputs.run == 'true'
        run: python tools/check_context_markers.py

      - name: Audit semantic marker consistency
        if: steps.pending.outputs.run == 'true'
        run: python tools/audit_contextes_semantiques.py

      - name: Measure context coverage
        if: steps.pending.outputs.run == 'true'
        run: python tools/audit_contextes_utilisation.py

      - name: Assert lightweight validation produced no PDF
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          if find . -type f -iname '*.pdf' -newer .qa/finalize-livre-iv-ch04.py -print -quit | grep -q .; then
            echo "Un PDF a été produit pendant la validation légère."
            exit 1
          fi

      - name: Upload QA evidence
        if: steps.pending.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: livre-iv-ch04-validation-without-pdf
          path: |
            Livre-IV/QA/AUDIT-CHAPITRE-04.md
            Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-04.yaml
          if-no-files-found: error

      - name: Commit finalized chapter lot
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          rm .qa/finalize-livre-iv-ch04.py
          rm .qa/ch04-chapter.zlib.b64
          rm .qa/ch04-audit.zlib.b64
          rm .qa/ch04-proof.zlib.b64
          rm .github/workflows/livre-iv-ch04-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(livre-iv): créer le chapitre 4 sur le débogage"
          git push origin HEAD:docs/livre-iv-chapitre-04-debogage
