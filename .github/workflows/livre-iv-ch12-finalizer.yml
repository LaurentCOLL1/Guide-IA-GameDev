name: Livre IV Chapter 12 Finalizer

on:
  push:
    branches:
      - docs/livre-iv-chapitre-12-synchronisation-autorite-prediction
    paths:
      - ".chapter12/**"
      - "tools/finalize_livre_iv_ch12.py"
      - ".github/workflows/livre-iv-ch12-finalizer.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".chapter12/**"
      - "tools/finalize_livre_iv_ch12.py"
      - ".github/workflows/livre-iv-ch12-finalizer.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/livre-iv-chapitre-12-synchronisation-autorite-prediction

      - name: Install lightweight dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Reconstruct, validate and clean
        id: finalize
        continue-on-error: true
        run: python tools/finalize_livre_iv_ch12.py > /tmp/livre-iv-ch12-finalizer.log 2>&1

      - name: Upload finalizer diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livre-iv-ch12-finalizer-diagnostic
          path: /tmp/livre-iv-ch12-finalizer.log
          if-no-files-found: error

      - name: Stop after finalizer failure
        if: steps.finalize.outcome == 'failure'
        run: exit 1

      - name: Upload finalizer evidence
        uses: actions/upload-artifact@v4
        with:
          name: livre-iv-ch12-validation-without-pdf
          path: /tmp/livre-iv-ch12-finalizer-report.txt
          if-no-files-found: error

      - name: Commit permanent chapter lot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "docs(livre-iv): créer le chapitre 12 sur la synchronisation"
          git push origin HEAD:docs/livre-iv-chapitre-12-synchronisation-autorite-prediction
