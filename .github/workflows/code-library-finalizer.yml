name: Temporary Code Library Finalizer

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 407 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/companion-pack-code-library'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Code Library branch
        uses: actions/checkout@v4
        with:
          ref: feat/companion-pack-code-library
          fetch-depth: 0

      - name: Load finalizer from main
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/scripts/finalize_code_library.py > "$RUNNER_TEMP/finalize_code_library.py"
          python3 -m py_compile "$RUNNER_TEMP/finalize_code_library.py"

      - name: Finalize Pack 4 governance
        shell: bash
        run: python3 "$RUNNER_TEMP/finalize_code_library.py"

      - name: Validate documentation and Code Library
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: Companion-Pack/Code-Library/python/src
        run: |
          set -euo pipefail
          mkdir -p dist/code-library
          python3 tools/validate_chapters.py --root . --report dist/QA-CHAPTERS.md
          python3 tools/validate_livre_v_references.py --check
          python3 tools/check_code_explanation_structure.py --check
          python3 tools/check_context_markers.py --check
          python3 tools/audit_contextes_semantiques.py --check
          python3 tools/report_contextes_utilisation.py > dist/QA-CONTEXTES-COUVERTURE.md
          python3 Companion-Pack/Code-Library/tools/validate_code_library.py \
            --report dist/code-library/final-static-validation.json
          python3 -m unittest discover \
            -s Companion-Pack/Code-Library/python/tests \
            -v
          test ! -e dist/Guide-IA-GameDev.pdf

      - name: Commit finalized Pack 4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Companion-Pack/Code-Library \
            Companion-Pack/index.md \
            plans/COMPANION-PACK-PLAN-MAITRE.md \
            ROADMAP.md \
            contents.txt \
            CONTINUITE-PROJET.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No finalization change to commit."
            exit 0
          fi
          git commit -m "qa(code-library): finaliser le Pack 4 et la gouvernance"
          git push origin HEAD:feat/companion-pack-code-library
