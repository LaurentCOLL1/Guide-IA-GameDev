name: Build Publication Formats

on:
  pull_request:
    branches: [main]
    paths:
      - "Volume-0/**"
      - "Livre-I/**"
      - "Livre-II/**"
      - "Livre-III/**"
      - "Livre-IV/**"
      - "Livre-V/**"
      - "README.md"
      - "LICENSE.md"
      - "NOTICE.md"
      - "LICENSES/**"
      - "contents.txt"
      - "metadata.yaml"
      - "metadata-accessible-pdf.yaml"
      - "filters/**"
      - "build.sh"
      - "build.ps1"
      - "build-accessible.sh"
      - "build-accessible.ps1"
      - "BUILD.md"
      - "tools/build_publications.py"
      - "tools/validate_publications.py"
      - "tools/build_accessible_pdf.py"
      - "tools/validate_accessible_pdf.py"
      - "tools/validate_licenses.py"
      - "QA/*PUBLICATION-FORMATS*"
      - "QA/*ACCESSIBLE-PDF*"
      - "ROADMAP.md"
      - "CONTINUITE-PROJET.md"
      - ".github/scripts/finalize_publication_formats.py"
      - ".github/workflows/finalize-publication-formats.yml"
      - ".github/workflows/build-publication-formats.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-publications:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_DATE_EPOCH: "1785452640"
    steps:
      - uses: actions/checkout@v4

      - name: Verify permanent publication tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/scripts/finalize_publication_formats.py
          test ! -e .github/workflows/finalize-publication-formats.yml
          test -z "$(git ls-files 'dist/publications/**')"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publication toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra \
            lmodern librsvg2-bin fonts-dejavu-core poppler-utils
          pandoc --version | head -n 2
          xelatex --version | head -n 1
          rsvg-convert --version
          python --version

      - name: Build PDF HTML and EPUB
        run: python tools/build_publications.py --clean --formats pdf html epub

      - name: Validate generated formats
        run: python tools/validate_publications.py --report dist/publications/validation.json

      - name: Run repository validations
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet PyYAML
          python tools/validate_chapters.py
          python tools/validate_licenses.py --report dist/publications/licensing-validation.json
          git status --short | tee dist/publications/git-status.txt
          test ! -s dist/publications/git-status.txt

      - name: Record tool versions and checksums
        shell: bash
        run: |
          set -euo pipefail
          pandoc --version > dist/publications/pandoc-version.txt
          xelatex --version > dist/publications/xelatex-version.txt
          python --version > dist/publications/python-version.txt 2>&1
          sha256sum dist/publications/Guide-IA-GameDev.* > dist/publications/SHA256SUMS
          find dist/publications -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > dist/publications/files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: guide-ia-gamedev-publication-formats
          path: dist/publications
          if-no-files-found: error
          retention-days: 30

  build-accessible-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_DATE_EPOCH: "1785452640"
      PANDOC_LATEX_IMAGE: "pandoc/latex:3.10.0.0-ubuntu@sha256:568ae5d3dc4cf9266753c9c78e7d073c1472f6540e0cf02de6a330143df8bdb7"
      VERAPDF_IMAGE: "verapdf/cli:v1.30.2@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb"
    steps:
      - uses: actions/checkout@v4

      - name: Verify permanent accessible publication tree
        shell: bash
        run: |
          set -euo pipefail
          test -f metadata-accessible-pdf.yaml
          test -f tools/build_accessible_pdf.py
          test -f tools/validate_accessible_pdf.py
          test -z "$(git ls-files 'dist/publications/**')"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host validators
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core poppler-utils qpdf
          python --version
          docker --version
          pdfinfo -v 2>&1 | head -n 1
          qpdf --version

      - name: Pull pinned accessibility toolchains
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PANDOC_LATEX_IMAGE"
          docker pull "$VERAPDF_IMAGE"
          docker image inspect --format '{{join .RepoDigests "\n"}}' "$PANDOC_LATEX_IMAGE"
          docker image inspect --format '{{join .RepoDigests "\n"}}' "$VERAPDF_IMAGE"

      - name: Build tagged PDF candidate
        run: python tools/build_accessible_pdf.py --clean

      - name: Upload accessible build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-ia-gamedev-accessible-pdf-diagnostics
          path: dist/publications/accessible-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate PDF UA candidate
        run: python tools/validate_accessible_pdf.py --report dist/publications/accessible-pdf-validation.json

      - name: Run repository validations
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet PyYAML
          python tools/validate_chapters.py
          python tools/validate_licenses.py --report dist/publications/licensing-validation.json
          git status --short | tee dist/publications/git-status.txt
          test ! -s dist/publications/git-status.txt

      - name: Record accessibility toolchain and checksums
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$PANDOC_LATEX_IMAGE" > dist/publications/pandoc-latex-image.json
          docker image inspect "$VERAPDF_IMAGE" > dist/publications/verapdf-image.json
          docker run --rm "$PANDOC_LATEX_IMAGE" --version > dist/publications/pandoc-accessible-version.txt
          docker run --rm --entrypoint lualatex "$PANDOC_LATEX_IMAGE" --version > dist/publications/lualatex-version.txt
          docker run --rm "$VERAPDF_IMAGE" --version > dist/publications/verapdf-version.txt
          pdfinfo dist/publications/Guide-IA-GameDev-accessible.pdf > dist/publications/accessible-pdf-info.txt
          sha256sum dist/publications/Guide-IA-GameDev-accessible.pdf > dist/publications/ACCESSIBLE-PDF-SHA256SUMS
          find dist/publications -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > dist/publications/accessible-files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: guide-ia-gamedev-accessible-pdf
          path: dist/publications
          if-no-files-found: error
          retention-days: 30
