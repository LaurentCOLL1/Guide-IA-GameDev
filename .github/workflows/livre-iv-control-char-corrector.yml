name: Livre IV Control Character Corrector

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .qa/livre-iv-control-char-fix.trigger

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'qa/livre-iv-pdf-closure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/livre-iv-pdf-closure
          fetch-depth: 0
      - name: Replace forbidden control characters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = {
              Path("Livre-IV/CHAPITRE-16-Exports-Godot-et-packaging.md"): [
                  (b"platform-tools\x07db.exe", b"platform-tools\\adb.exe"),
              ],
              Path("Livre-IV/CHAPITRE-18-Accessibilite.md"): [
                  (b"docs\x07ccessibility\task-barriers.yaml", b"docs\\accessibility\\task-barriers.yaml"),
                  (b"docs\x07ccessibility\\public-statement.md", b"docs\\accessibility\\public-statement.md"),
              ],
          }

          for path, pairs in replacements.items():
              data = path.read_bytes()
              for old, new in pairs:
                  count = data.count(old)
                  if count != 1:
                      raise RuntimeError(f"{path}: expected one occurrence of {old!r}, found {count}")
                  data = data.replace(old, new, 1)
              path.write_bytes(data)

          problems = []
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8", "surrogateescape"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              line = 1
              column = 0
              for index, byte in enumerate(data):
                  if byte == 10:
                      line += 1
                      column = 0
                      continue
                  column += 1
                  if byte in (*range(0, 9), 11, 12, *range(14, 32), 127):
                      problems.append(f"{path}:{line}:{column}:0x{byte:02x}:offset={index}")
          if problems:
              raise RuntimeError("Forbidden control characters remain:\n" + "\n".join(problems))

          for temporary in [
              Path(".github/workflows/livre-iv-control-char-corrector.yml"),
              Path(".github/workflows/livre-iv-control-char-scan.yml"),
              Path(".qa/livre-iv-control-char-fix.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          PY
      - name: Commit corrected sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(livre-iv): supprimer les caractères de contrôle invisibles"
          git push origin HEAD:qa/livre-iv-pdf-closure
