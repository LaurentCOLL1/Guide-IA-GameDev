name: Livre IV Chapter 15 DCT Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'docs/livre-iv-chapitre-15-sauvegardes-migrations-reprise' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-15-sauvegardes-migrations-reprise
          fetch-depth: 0

      - name: Restore the container-terminal marker
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path

          chapter = Path('Livre-IV/CHAPITRE-15-Sauvegardes-migrations-et-reprise-apres-incident.md')
          text = chapter.read_text(encoding='utf-8')
          old = '> **[WSL] Terminal Bash ouvert dans le conteneur de diagnostic non privilégié — Adapter le chemin attendu.**'
          new = '> **[DCT] Terminal dans le conteneur de diagnostic non privilégié — Adapter le chemin attendu.**'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'repère conteneur attendu une fois, trouvé {count}')
          chapter.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          Path('/tmp/ch15-sha.txt').write_text(sha256(chapter.read_bytes()).hexdigest(), encoding='ascii')

      - name: Remove workflow and commit chapter
        id: content
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ch15-dct-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Livre-IV/CHAPITRE-15-Sauvegardes-migrations-et-reprise-apres-incident.md .github/workflows/ch15-dct-fix.yml
          git commit -m "docs(ch15): rétablir le repère du terminal conteneur"
          CONTENT_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:docs/livre-iv-chapitre-15-sauvegardes-migrations-reprise
          echo "content_sha=$CONTENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Refresh evidence
        env:
          CONTENT_SHA: ${{ steps.content.outputs.content_sha }}
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          proof = Path('Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-15.yaml')
          text = proof.read_text(encoding='utf-8')
          chapter_hash = Path('/tmp/ch15-sha.txt').read_text(encoding='ascii').strip()
          text, count = re.subn(r'validated-head-commit: [0-9a-f]{40}', f'validated-head-commit: {os.environ["CONTENT_SHA"]}', text)
          if count != 1:
              raise SystemExit(f'validated-head-commit: attendu 1, trouvé {count}')
          text, count = re.subn(r'  chapter-sha256: [0-9a-f]{64}', f'  chapter-sha256: {chapter_hash}', text)
          if count != 1:
              raise SystemExit(f'chapter-sha256: attendu 1, trouvé {count}')
          text, count = re.subn(
              r'    run-id: pending-after-user-trigger\n    conclusion: pending',
              '    run-id: pending-after-dct-fix\n    conclusion: pending',
              text,
          )
          if count != 1:
              raise SystemExit(f'workflow pending: attendu 1, trouvé {count}')
          text, count = re.subn(
              r'evidence-closure:\n  commit: [0-9a-f]{40}\n  conclusion: success',
              f'evidence-closure:\n  commit: {os.environ["CONTENT_SHA"]}\n  conclusion: success',
              text,
          )
          if count != 1:
              raise SystemExit(f'evidence-closure: attendu 1, trouvé {count}')
          proof.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit refreshed evidence
        shell: bash
        run: |
          set -euo pipefail
          git add Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-15.yaml
          git commit -m "docs(qa): actualiser la preuve après correction DCT"
          git push origin HEAD:docs/livre-iv-chapitre-15-sauvegardes-migrations-reprise
