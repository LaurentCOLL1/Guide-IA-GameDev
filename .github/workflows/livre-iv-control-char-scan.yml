name: Livre IV Control Character Scan

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  scan:
    if: github.head_ref == 'qa/livre-iv-pdf-closure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Scan tracked text files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          report = []
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8", "surrogateescape"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              line = 1
              column = 0
              for index, byte in enumerate(data):
                  if byte == 10:
                      line += 1
                      column = 0
                      continue
                  column += 1
                  if byte in (*range(0, 9), 11, 12, *range(14, 32), 127):
                      report.append(f"{path}:{line}:{column}:0x{byte:02x}:offset={index}")
          out = Path("control-chars.txt")
          out.write_text("\n".join(report) + ("\n" if report else ""), encoding="utf-8")
          print(out.read_text(encoding="utf-8") or "No forbidden control characters found.")
          if report:
              raise SystemExit(1)
          PY
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livre-iv-control-character-scan
          path: control-chars.txt
          if-no-files-found: error
          retention-days: 7
