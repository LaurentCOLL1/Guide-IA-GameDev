name: Livre IV Chapter 11 Finalizer

on:
  push:
    branches:
      - docs/livre-iv-chapitre-11-architecture-multijoueur
    paths:
      - '.qa/ch11/**'
      - '.github/workflows/livre-iv-ch11-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-iv-chapitre-11-architecture-multijoueur
          fetch-depth: 1

      - name: Detect pending finalizer
        id: pending
        shell: bash
        run: |
          if test -f .qa/ch11/finalize.py; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lightweight dependencies
        if: steps.pending.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Materialize chapter lot
        if: steps.pending.outputs.run == 'true'
        run: python .qa/ch11/finalize.py

      - name: Assert reader boundaries
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          chapter="Livre-IV/CHAPITRE-11-Architecture-multijoueur.md"
          ! grep -qi 'GPT-5.6 Sol' "$chapter"
          ! grep -qi 'Prochaine action' "$chapter"
          ! grep -qi 'PDF' "$chapter"
          ! grep -qi 'recommended-reasoning' "$chapter"

      - name: Validate structure metadata links and duplicates
        if: steps.pending.outputs.run == 'true'
        run: python tools/validate_chapters.py

      - name: Validate structured explanations
        if: steps.pending.outputs.run == 'true'
        run: python tools/check_code_explanation_structure.py

      - name: Audit usage markers
        if: steps.pending.outputs.run == 'true'
        run: python tools/check_context_markers.py --check

      - name: Audit semantic marker consistency
        if: steps.pending.outputs.run == 'true'
        run: python tools/audit_contextes_semantiques.py --check

      - name: Verify exact chapter metrics
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("Livre-IV/CHAPITRE-11-Architecture-multijoueur.md")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          headings = sum(1 for line in lines if re.match(r"^#{1,6}\s+", line))
          markers = text.count("<!-- qa:code-explanation -->")
          structured = text.count("**Explication structurée du bloc :**")
          diagnostics = len(re.findall(r"^### 49\.\d+ ", text, re.MULTILINE))
          metrics = (len(lines), headings, markers, structured, diagnostics)
          if metrics != (2065, 64, 59, 39, 10):
              raise SystemExit({"metrics": metrics})
          solo = re.search(r"^## 46\. Modes Solo et Studio$(.*?)(?=^## )", text, re.MULTILINE | re.DOTALL)
          if solo is None or re.search(r"^```|^~~~", solo.group(1), re.MULTILINE):
              raise SystemExit("Section Solo/Studio absente ou contenant un bloc clôturé")
          print({"chapter": path.as_posix(), "metrics": metrics})
          PY

      - name: Assert lightweight validation produced no PDF
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          if find . -type f -iname '*.pdf' -newer .qa/ch11/finalize.py -print -quit | grep -q .; then
            echo "Un PDF a été produit pendant la validation légère."
            exit 1
          fi

      - name: Upload QA evidence
        if: steps.pending.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: livre-iv-ch11-validation-without-pdf
          path: |
            Livre-IV/QA/AUDIT-CHAPITRE-11.md
            Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-11.yaml
          if-no-files-found: error

      - name: Commit finalized chapter lot
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          rm -rf .qa/ch11
          rm .github/workflows/livre-iv-ch11-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(livre-iv): créer le chapitre 11 sur l’architecture multijoueur"
          git push origin HEAD:docs/livre-iv-chapitre-11-architecture-multijoueur
