name: Livre IV Chapter 13 Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".chapter13/**"
      - ".github/workflows/livre-iv-ch13-finalizer.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/livre-iv-chapitre-13-serveurs-dedies-securite

      - name: Install lightweight dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Restore finalizer
        run: |
          python - <<'PY'
          import zlib
          from pathlib import Path
          Path('/tmp/finalize_livre_iv_ch13.py').write_bytes(
              zlib.decompress(
                  Path('.chapter13/finalizer.a.bin').read_bytes()
                  + Path('.chapter13/finalizer.b.bin').read_bytes()
              )
          )
          PY

      - name: Materialize and validate permanent lot
        run: python /tmp/finalize_livre_iv_ch13.py

      - name: Upload finalizer evidence
        uses: actions/upload-artifact@v4
        with:
          name: livre-iv-ch13-validation-without-pdf
          path: /tmp/livre-iv-ch13-finalizer-report.txt
          if-no-files-found: error

      - name: Commit permanent chapter lot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CONTINUITE-PROJET.md \
            Livre-IV/CHAPITRE-13-Serveurs-dedies-et-securite-reseau.md \
            Livre-IV/QA/AUDIT-CHAPITRE-13.md \
            Livre-IV/QA/VALIDATION-FINALE-CHAPITRE-13.yaml \
            Livre-IV/index.md \
            ROADMAP.md \
            contents.txt \
            plans/LIVRE-IV-PLAN-MAITRE.md
          git diff --cached --quiet && exit 1
          git commit -m "docs(livre-iv): créer le chapitre 13 sur les serveurs dédiés"
          git push origin HEAD:docs/livre-iv-chapitre-13-serveurs-dedies-securite
