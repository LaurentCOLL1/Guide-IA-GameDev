name: Temporary Livre V Chapter 12 Finalizer

on:
  push:
    branches:
      - docs/livre-v-ch12-reference-python
    paths:
      - ".github/workflows/tmp_l5_ch12_finalizer.yml"
      - "tools/tmp_l5_ch12_finalize.py"
      - "tools/tmp_l5_ch12_trigger.txt"
      - "Livre-V/CHAPITRE-12-Reference-Python.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/tmp_l5_ch12_finalizer.yml"
      - "tools/tmp_l5_ch12_finalize.py"
      - "tools/tmp_l5_ch12_trigger.txt"
      - "Livre-V/CHAPITRE-12-Reference-Python.md"

permissions:
  contents: write

concurrency:
  group: livre-v-ch12-finalizer
  cancel-in-progress: false

jobs:
  finalize-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
        with:
          ref: docs/livre-v-ch12-reference-python
          fetch-depth: 0

      - name: Finalize audit, proof and governance
        run: python3 tools/tmp_l5_ch12_finalize.py

      - name: Correct audit timestamp and proof hash
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re

          audit = Path("Livre-V/QA/AUDIT-CHAPITRE-12.md")
          proof = Path("Livre-V/QA/VALIDATION-FINALE-CHAPITRE-12.yaml")
          stamp = "2026-07-28T22:48:26+02:00"

          audit_text = audit.read_text(encoding="utf-8")
          needle = f'last-verified: "{stamp}"\naudit-level: "static-review"'
          replacement = (
              f'last-verified: "{stamp}"\n'
              f'audit-date: "{stamp}"\n'
              'audit-level: "static-review"'
          )
          if audit_text.count(needle) != 1:
              raise RuntimeError("Insertion audit-date non déterministe")
          audit.write_text(audit_text.replace(needle, replacement, 1), encoding="utf-8")

          proof_text = proof.read_text(encoding="utf-8")
          new_hash = sha256(audit.read_bytes()).hexdigest()
          proof_text, count = re.subn(
              r"audit-sha256: [0-9a-f]{64}",
              f"audit-sha256: {new_hash}",
              proof_text,
              count=1,
          )
          if count != 1:
              raise RuntimeError("Mise à jour de l'empreinte d'audit impossible")
          proof.write_text(proof_text, encoding="utf-8")
          PY

      - name: Install lightweight dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Validate structure, metadata, links and duplicates
        run: |
          mkdir -p dist
          set -o pipefail
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md \
            | tee dist/QA-CHAPTERS.log

      - name: Validate Livre V cards and deep links
        run: |
          set -o pipefail
          python3 tools/validate_livre_v_references.py --check \
            | tee dist/QA-LIVRE-V-REFERENCES.log

      - name: Validate structured code explanations
        run: |
          set -o pipefail
          python3 tools/check_code_explanation_structure.py --check \
            | tee dist/QA-EXPLICATIONS-CODE.log

      - name: Audit usage marker presence
        run: |
          set -o pipefail
          python3 tools/check_context_markers.py --check \
            | tee dist/QA-CONTEXTES.log

      - name: Audit semantic marker consistency
        run: |
          set -o pipefail
          python3 tools/audit_contextes_semantiques.py --check \
            | tee dist/QA-CONTEXTES-SEMANTIQUES.log

      - name: Measure context coverage
        run: |
          set -o pipefail
          python3 tools/report_contextes_utilisation.py \
            | tee dist/QA-CONTEXTES-COUVERTURE.md

      - name: Assert that no PDF was produced
        run: |
          if find . -type f -name '*.pdf' -print -quit | grep -q .; then
            echo "Un PDF a été produit pendant une validation légère." >&2
            exit 1
          fi

      - name: Commit permanent chapter lot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CONTINUITE-PROJET.md \
            ROADMAP.md \
            contents.txt \
            plans/LIVRE-V-PLAN-MAITRE.md \
            Livre-V/index.md \
            Livre-V/CHAPITRE-12-Reference-Python.md \
            Livre-V/QA/AUDIT-CHAPITRE-12.md \
            Livre-V/QA/VALIDATION-FINALE-CHAPITRE-12.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Lot permanent déjà enregistré."
          else
            git commit -m "docs(livre-v): ajouter la référence Python"
            git push origin HEAD:docs/livre-v-ch12-reference-python
          fi

      - name: Upload lightweight QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livre-v-ch12-validation
          if-no-files-found: warn
          retention-days: 30
          path: |
            dist/QA-CHAPTERS.md
            dist/QA-CHAPTERS.log
            dist/QA-LIVRE-V-REFERENCES.log
            dist/QA-EXPLICATIONS-CODE.log
            dist/QA-CONTEXTES.log
            dist/QA-CONTEXTES-SEMANTIQUES.log
            dist/QA-CONTEXTES-COUVERTURE.md
