name: Temporary Livre V PDF Closure Finalizer

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 381 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'qa/livre-v-pdf-closure'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install lightweight dependency
        run: python3 -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Finalize governance and evidence
        env:
          FINALIZER_RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/finalize_livre_v_pdf_closure.py

      - name: Validate chapters without PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/validate_chapters.py --report dist/QA-CHAPTERS.md
          python3 tools/validate_livre_v_references.py --check
          python3 tools/check_code_explanation_structure.py --check
          python3 tools/check_context_markers.py --check
          python3 tools/audit_contextes_semantiques.py --check
          python3 tools/report_contextes_utilisation.py > dist/QA-CONTEXTES-COUVERTURE.md

      - name: Remove temporary script and reports
        shell: bash
        run: |
          rm -rf dist
          rm -f .github/scripts/finalize_livre_v_pdf_closure.py

      - name: Verify permanent closure lot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t actual < <(git diff --name-only origin/main | grep -v '^.github/workflows/livre-v-pdf-closure-finalizer.yml$' | sort)
          mapfile -t expected < <(printf '%s\n' \
            CONTINUITE-PROJET.md \
            Livre-V/CHAPITRE-05-Fiches-des-modeles-de-langage.md \
            Livre-V/QA/CLOTURE-LIVRE-V.md \
            Livre-V/QA/VALIDATION-PUBLICATION-LIVRE-V.yaml \
            Livre-V/index.md \
            ROADMAP.md \
            plans/LIVRE-V-PLAN-MAITRE.md | sort)
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Commit finalized closure lot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'qa(livre-v): finaliser la clôture technique et PDF'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
