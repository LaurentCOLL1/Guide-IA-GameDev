name: Livre V Chapter 1 Builder

on:
  push:
    branches:
      - docs/livre-v-ch01-carte-collection
    paths:
      - .github/workflows/tmp_l5_ch01_builder.yml
      - tools/tmp_l5_ch01_builder.py
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: livre-v-ch01-builder
  cancel-in-progress: false

jobs:
  build-and-validate:
    if: github.head_ref == 'docs/livre-v-ch01-carte-collection' || github.ref_name == 'docs/livre-v-ch01-carte-collection'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/livre-v-ch01-carte-collection
          fetch-depth: 0

      - name: Detect completed permanent lot
        id: guard
        shell: bash
        run: |
          if [[ -f Livre-V/CHAPITRE-01-Carte-generale-de-la-collection.md ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare permanent chapter lot
        if: steps.guard.outputs.skip != 'true'
        run: python tools/tmp_l5_ch01_builder.py prepare

      - name: Normalize generated Python whitespace
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: sed -i 's/[[:space:]]\+$//' tools/check_context_markers.py

      - name: Validate chapters without PDF
        if: steps.guard.outputs.skip != 'true'
        run: python tools/validate_chapters.py --root . --report dist/QA-CHAPTERS.md

      - name: Validate usage contexts
        if: steps.guard.outputs.skip != 'true'
        run: python tools/check_context_markers.py --check

      - name: Finalize QA proof without deleting runner
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          script_path = Path('tools/tmp_l5_ch01_builder.py')
          spec = importlib.util.spec_from_file_location('l5_builder', script_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          chapter = Path('Livre-V/CHAPITRE-01-Carte-generale-de-la-collection.md').read_text(encoding='utf-8')
          metrics = module.chapter_metrics(chapter)
          Path('Livre-V/QA/VALIDATION-FINALE-CHAPITRE-01.yaml').write_text(
              module.render_proof(metrics, 'complete', 'success'),
              encoding='utf-8',
              newline='\n',
          )
          PY

      - name: Commit permanent lot
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          diagnostic=/tmp/l5-ch01-commit-diagnostic.txt
          : > "$diagnostic"
          status=0

          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "## status before add"
            git status --short
            echo "## add"
            git add CONTINUITE-PROJET.md ROADMAP.md contents.txt plans/LIVRE-V-PLAN-MAITRE.md \
              Livre-V/index.md Livre-V/CHAPITRE-01-Carte-generale-de-la-collection.md \
              Livre-V/QA/AUDIT-CHAPITRE-01.md Livre-V/QA/VALIDATION-FINALE-CHAPITRE-01.yaml \
              tools/validate_chapters.py tools/check_context_markers.py
            add_status=$?
            echo "add_status=$add_status"
            if [[ $add_status -ne 0 ]]; then status=$add_status; fi

            echo "## cached diff check"
            git diff --cached --check
            check_status=$?
            echo "check_status=$check_status"
            if [[ $check_status -ne 0 ]]; then status=$check_status; fi

            echo "## cached diff stat"
            git diff --cached --stat

            if [[ $status -eq 0 ]]; then
              echo "## commit"
              git commit -m "docs(livre-v): créer la carte générale de la collection"
              commit_status=$?
              echo "commit_status=$commit_status"
              if [[ $commit_status -ne 0 ]]; then status=$commit_status; fi
            fi

            if [[ $status -eq 0 ]]; then
              echo "## push"
              git push origin HEAD:docs/livre-v-ch01-carte-collection
              push_status=$?
              echo "push_status=$push_status"
              if [[ $push_status -ne 0 ]]; then status=$push_status; fi
            fi
          } 2>&1 | tee "$diagnostic"

          if [[ $status -ne 0 ]]; then
            gh pr comment 325 --body-file "$diagnostic" || true
          fi
          exit "$status"
